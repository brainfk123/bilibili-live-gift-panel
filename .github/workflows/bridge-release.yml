name: Exact v0.4.11 RushRush bridge release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: gift-panel-bridge-v0.4.11
  cancel-in-progress: false

jobs:
  bridge-release:
    runs-on: windows-latest
    environment: bridge-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      BRIDGE_TAG: "v0.4.11"
    steps:
      - name: Validate fixed bridge release request
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:BRIDGE_TAG -cne 'v0.4.11') {
            throw 'This workflow can publish only the manually dispatched exact v0.4.11 bridge.'
          }

      - name: Validate reviewed bridge tooling commit
        shell: pwsh
        env:
          BRIDGE_TOOLING_COMMIT_SHA: ${{ vars.BRIDGE_TOOLING_COMMIT_SHA }}
        run: |
          if ($env:BRIDGE_TOOLING_COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Reviewed bridge tooling commit is invalid.' }

      - name: Check out reviewed bridge tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ vars.BRIDGE_TOOLING_COMMIT_SHA }}
          path: release-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Set up reviewed bridge tooling Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: release-tools/goserver/go.mod
          cache-dependency-path: release-tools/goserver/go.sum

      - name: Build reviewed bridge security tools
        shell: pwsh
        run: |
          Copy-Item -LiteralPath release-tools -Destination "$env:RUNNER_TEMP/release-tools" -Recurse
          go -C release-tools/goserver build -o "$env:RUNNER_TEMP/artifact-inspector.exe" ./cmd/artifact-inspector
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed bridge artifact inspector build failed.' }
          go -C release-tools/updateapi build -o "$env:RUNNER_TEMP/trustpolicy.exe" ./cmd/trustpolicy
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed trustpolicy verifier build failed.' }
          Copy-Item -LiteralPath release-tools/scripts/sign-evsign.mjs -Destination "$env:RUNNER_TEMP/sign-evsign.mjs"
          Copy-Item -LiteralPath release-tools/scripts/bridge-release-inputs.mjs -Destination "$env:RUNNER_TEMP/bridge-release-inputs.mjs"
          Copy-Item -LiteralPath release-tools/scripts/bounded-github-asset.mjs -Destination "$env:RUNNER_TEMP/bounded-github-asset.mjs"
          "AUTHENTICODE_INSPECTOR_PATH=$env:RUNNER_TEMP/artifact-inspector.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVSIGN_SCRIPT_PATH=$env:RUNNER_TEMP/sign-evsign.mjs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_READINESS_SCRIPT_PATH=$env:RUNNER_TEMP/bridge-release-inputs.mjs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOUNDED_GITHUB_ASSET_SCRIPT_PATH=$env:RUNNER_TEMP/bounded-github-asset.mjs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRUSTPOLICY_INSPECTOR_PATH=$env:RUNNER_TEMP/trustpolicy.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TOOL_ROOT=$env:RUNNER_TEMP/release-tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_READINESS_ROOT=$env:RUNNER_TEMP/bridge-readiness" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out exact bridge tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v0.4.11
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact reviewed bridge tag after checkout
        shell: pwsh
        env:
          BRIDGE_REVIEWED_COMMIT_SHA: ${{ vars.BRIDGE_REVIEWED_COMMIT_SHA }}
          BRIDGE_REVIEWED_TAG_OBJECT_SHA: ${{ vars.BRIDGE_REVIEWED_TAG_OBJECT_SHA }}
        run: |
          if ($env:BRIDGE_REVIEWED_COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'reviewed bridge tag binding failed' }
          $tagObject = git rev-parse refs/tags/v0.4.11
          $tagCommit = git rev-parse refs/tags/v0.4.11^{commit}
          $headCommit = git rev-parse HEAD
          $remoteLines = @(git ls-remote origin refs/tags/v0.4.11 refs/tags/v0.4.11^{})
          if ($LASTEXITCODE -ne 0 -or $remoteLines.Count -lt 1 -or $remoteLines.Count -gt 2) { throw 'reviewed bridge tag binding failed' }
          $remote = @{}
          foreach ($line in $remoteLines) {
            $parts = $line -split "`t", 2
            if ($parts.Count -ne 2 -or $parts[0] -cnotmatch '^[0-9a-f]{40}$' -or $remote.ContainsKey($parts[1]) -or $parts[1] -notin @('refs/tags/v0.4.11','refs/tags/v0.4.11^{}')) { throw 'reviewed bridge tag binding failed' }
            $remote[$parts[1]] = $parts[0]
          }
          if (-not $remote.ContainsKey('refs/tags/v0.4.11') -or $remote['refs/tags/v0.4.11'] -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -or $tagObject -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($remote.ContainsKey('refs/tags/v0.4.11^{}')) {
            if ($remoteLines.Count -ne 2 -or $remote['refs/tags/v0.4.11^{}'] -cne $env:BRIDGE_REVIEWED_COMMIT_SHA -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -ceq $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }
          } elseif ($remoteLines.Count -ne 1 -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($tagCommit -cne $headCommit -or $tagCommit -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -cne '0.4.11') {
            throw 'The exact v0.4.11 tag does not contain package version 0.4.11.'
          }
          "BRIDGE_COMMIT=$headCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reject conflicting GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:BRIDGE_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $null = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode -eq [Net.HttpStatusCode]::NotFound) { exit 0 }
            throw 'GitHub Release lookup failed without an exact 404.'
          }
          throw 'Existing v0.4.11 GitHub Release conflicts with this create-only workflow.'

      - name: Validate reviewed bridge inputs
        shell: pwsh
        env:
          BRIDGE_REVIEWED_COMMIT_SHA: ${{ vars.BRIDGE_REVIEWED_COMMIT_SHA }}
          BRIDGE_TRUST_ROOT_SPKI_B64: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_B64 }}
          BRIDGE_TRUST_ROOT_SPKI_SHA256: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_B64: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_B64 }}
          BRIDGE_BOOTSTRAP_POLICY_SHA256: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_EPOCH: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_EPOCH }}
          BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
          BRIDGE_UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL }}
          BRIDGE_OBSERVATION_EVIDENCE_B64: ${{ vars.BRIDGE_OBSERVATION_EVIDENCE_B64 }}
          BRIDGE_OBSERVATION_EVIDENCE_SHA256: ${{ vars.BRIDGE_OBSERVATION_EVIDENCE_SHA256 }}
          BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64: ${{ vars.BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64 }}
          BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256: ${{ vars.BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256 }}
        run: |
          $required = @(
            'BRIDGE_REVIEWED_COMMIT_SHA',
            'BRIDGE_TRUST_ROOT_SPKI_B64',
            'BRIDGE_TRUST_ROOT_SPKI_SHA256',
            'BRIDGE_BOOTSTRAP_POLICY_B64',
            'BRIDGE_BOOTSTRAP_POLICY_SHA256',
            'BRIDGE_BOOTSTRAP_POLICY_EPOCH',
            'BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256',
            'BRIDGE_UPDATE_API_BASE_URL',
            'BRIDGE_OBSERVATION_EVIDENCE_B64',
            'BRIDGE_OBSERVATION_EVIDENCE_SHA256',
            'BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64',
            'BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value -cne $value.Trim()) {
              throw 'A reviewed bridge input is missing or non-canonical.'
            }
          }
          if ($env:BRIDGE_TRUST_ROOT_SPKI_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:BRIDGE_BOOTSTRAP_POLICY_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:BRIDGE_OBSERVATION_EVIDENCE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:BRIDGE_BOOTSTRAP_POLICY_EPOCH -cnotmatch '^[1-9][0-9]*$') {
            throw 'A reviewed bridge digest or epoch is malformed.'
          }
          try {
            $rootBytes = [Convert]::FromBase64String($env:BRIDGE_TRUST_ROOT_SPKI_B64)
            $policyBytes = [Convert]::FromBase64String($env:BRIDGE_BOOTSTRAP_POLICY_B64)
            $observationBytes = [Convert]::FromBase64String($env:BRIDGE_OBSERVATION_EVIDENCE_B64)
            $attestationBytes = [Convert]::FromBase64String($env:BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64)
          } catch {
            throw 'A reviewed bridge public input is not Base64.'
          }
          if ([Convert]::ToBase64String($rootBytes) -cne $env:BRIDGE_TRUST_ROOT_SPKI_B64 -or
              [Convert]::ToBase64String($policyBytes) -cne $env:BRIDGE_BOOTSTRAP_POLICY_B64 -or
              [Convert]::ToBase64String($observationBytes) -cne $env:BRIDGE_OBSERVATION_EVIDENCE_B64 -or
              [Convert]::ToBase64String($attestationBytes) -cne $env:BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64) {
            throw 'A reviewed bridge public input is not canonical Base64.'
          }
          $rootHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rootBytes)).ToLowerInvariant()
          $policyHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($policyBytes)).ToLowerInvariant()
          if ($rootHash -cne $env:BRIDGE_TRUST_ROOT_SPKI_SHA256 -or $policyHash -cne $env:BRIDGE_BOOTSTRAP_POLICY_SHA256) {
            throw 'A reviewed bridge public digest does not match its bytes.'
          }
          if ($env:BRIDGE_REVIEWED_COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'The reviewed bridge commit is malformed.' }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Fetch immutable v0.4.12 observation binding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_OBSERVATION_EVIDENCE_B64: ${{ vars.BRIDGE_OBSERVATION_EVIDENCE_B64 }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:BRIDGE_READINESS_ROOT | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.4.12" -Headers $headers
          } catch { throw 'Immutable v0.4.12 Release metadata is unavailable.' }
          if ($release.tag_name -cne 'v0.4.12' -or $release.draft -or $release.prerelease -or -not $release.published_at -or [int64]$release.id -le 0) {
            throw 'Immutable v0.4.12 Release metadata is invalid.'
          }
          $stableAssets = @($release.assets | Where-Object { $_.name -in @('gift-panel-windows-x64.exe','gift-panel-windows-x64.exe.sha256') })
          if ($stableAssets.Count -ne 2) { throw 'Immutable v0.4.12 security asset metadata is incomplete.' }
          foreach ($asset in $stableAssets) {
            if ([int64]$asset.size -le 0 -or [string]$asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or [string]$asset.url -cnotmatch '^https://api\.github\.com/repos/brainfk123/bilibili-live-gift-panel/releases/assets/[1-9][0-9]*$') { throw 'Immutable v0.4.12 security asset metadata is invalid.' }
          }
          $executableAsset = @($stableAssets | Where-Object { $_.name -ceq 'gift-panel-windows-x64.exe' })[0]
          $checksumAsset = @($stableAssets | Where-Object { $_.name -ceq 'gift-panel-windows-x64.exe.sha256' })[0]
          if ([int64]$executableAsset.size -gt 134217728 -or [string]$executableAsset.content_type -cne 'application/octet-stream' -or [int64]$checksumAsset.size -gt 16384 -or [string]$checksumAsset.content_type -cne 'text/plain') {
            throw 'Immutable v0.4.12 security asset size or media type is invalid.'
          }
          node $env:BOUNDED_GITHUB_ASSET_SCRIPT_PATH download --api-url $executableAsset.url --size $executableAsset.size --sha256 ([string]$executableAsset.digest).Substring(7) --content-type application/octet-stream --max-bytes 134217728 --output "$env:BRIDGE_READINESS_ROOT/stable-artifact.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Bounded v0.4.12 executable download failed.' }
          node $env:BOUNDED_GITHUB_ASSET_SCRIPT_PATH download --api-url $checksumAsset.url --size $checksumAsset.size --sha256 ([string]$checksumAsset.digest).Substring(7) --content-type text/plain --max-bytes 16384 --output "$env:BRIDGE_READINESS_ROOT/stable-checksum.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Bounded v0.4.12 checksum download failed.' }
          $selectedStableAssets = foreach ($asset in $stableAssets) { [ordered]@{ name=[string]$asset.name;size=[int64]$asset.size;digest=[string]$asset.digest;content_type=[string]$asset.content_type;url=[string]$asset.url } }
          [ordered]@{ id = [int64]$release.id; tag_name = [string]$release.tag_name; draft = [bool]$release.draft; prerelease = [bool]$release.prerelease; published_at = [string]$release.published_at; assets=@($selectedStableAssets) } |
            ConvertTo-Json -Compress | Set-Content -NoNewline -Encoding utf8 "$env:BRIDGE_READINESS_ROOT/stable-release.json"
          [IO.File]::WriteAllBytes("$env:BRIDGE_READINESS_ROOT/observation-evidence.json", [Convert]::FromBase64String($env:BRIDGE_OBSERVATION_EVIDENCE_B64))

      - name: Fetch immutable production trust binding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TRUST_ROOT_SPKI_B64: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_B64 }}
          BRIDGE_BOOTSTRAP_POLICY_B64: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_B64 }}
          BRIDGE_BOOTSTRAP_POLICY_SHA256: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_SHA256 }}
          BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64: ${{ vars.BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64 }}
        run: |
          $policyTag = 'publisher-policy-epoch-00000001'
          $bundleParent = "$env:BRIDGE_READINESS_ROOT/private-bundle"
          $bundleDirectory = "$bundleParent/bundle"
          $downloadDirectory = "$env:BRIDGE_READINESS_ROOT/policy-download"
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$policyTag" -Headers $headers
          } catch { throw 'Immutable epoch-1 policy Release metadata is unavailable.' }
          $assets = @($release.assets)
          if ($release.tag_name -cne $policyTag -or $release.draft -or $release.prerelease -or -not $release.published_at -or [int64]$release.id -le 0 -or $assets.Count -ne 3) {
            throw 'Immutable epoch-1 policy Release metadata is invalid.'
          }
          foreach ($name in @('policy.json','audit.json','commit.json')) {
            if (@($assets | Where-Object { $_.name -ceq $name }).Count -ne 1) { throw 'Immutable epoch-1 policy asset closure is invalid.' }
          }
          foreach ($asset in $assets) {
            $cap = if ($asset.name -ceq 'policy.json') { 262144 } else { 65536 }
            if ([int64]$asset.size -le 0 -or [int64]$asset.size -gt $cap -or [string]$asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or [string]$asset.content_type -cne 'application/json' -or [string]$asset.url -cnotmatch '^https://api\.github\.com/repos/brainfk123/bilibili-live-gift-panel/releases/assets/[1-9][0-9]*$') { throw 'Immutable epoch-1 policy asset metadata is invalid.' }
            node $env:BOUNDED_GITHUB_ASSET_SCRIPT_PATH download --api-url $asset.url --size $asset.size --sha256 ([string]$asset.digest).Substring(7) --content-type application/json --max-bytes $cap --output "$downloadDirectory/$($asset.name)"
            if ($LASTEXITCODE -ne 0) { throw 'Bounded epoch-1 policy asset download failed.' }
          }
          & $env:TRUSTPOLICY_INSPECTOR_PATH import-bundle --policy-source "$downloadDirectory/policy.json" --audit-source "$downloadDirectory/audit.json" --commit-source "$downloadDirectory/commit.json" --bundle-parent $bundleParent
          if ($LASTEXITCODE -ne 0) { throw 'Private publisher bundle import failed.' }
          $selectedAssets = foreach ($asset in $assets) { [ordered]@{ name = [string]$asset.name; size = [int64]$asset.size; digest = [string]$asset.digest; content_type=[string]$asset.content_type; url=[string]$asset.url } }
          [ordered]@{ id = [int64]$release.id; tag_name = [string]$release.tag_name; draft = [bool]$release.draft; prerelease = [bool]$release.prerelease; published_at = [string]$release.published_at; assets = @($selectedAssets) } |
            ConvertTo-Json -Depth 5 -Compress | Set-Content -NoNewline -Encoding utf8 "$env:BRIDGE_READINESS_ROOT/policy-release.json"
          [IO.File]::WriteAllBytes("$env:BRIDGE_READINESS_ROOT/root-spki.der", [Convert]::FromBase64String($env:BRIDGE_TRUST_ROOT_SPKI_B64))
          $bootstrapBytes = [Convert]::FromBase64String($env:BRIDGE_BOOTSTRAP_POLICY_B64)
          [IO.File]::WriteAllBytes("$env:BRIDGE_READINESS_ROOT/bootstrap-policy.json", $bootstrapBytes)
          $downloadedPolicy = [IO.File]::ReadAllBytes("$bundleDirectory/policy.json")
          $downloadedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($downloadedPolicy)).ToLowerInvariant()
          if ($downloadedHash -cne $env:BRIDGE_BOOTSTRAP_POLICY_SHA256 -or -not [Linq.Enumerable]::SequenceEqual[byte]($downloadedPolicy, $bootstrapBytes)) {
            throw 'Bootstrap policy bytes do not match the immutable epoch-1 policy Release.'
          }
          & $env:TRUSTPOLICY_INSPECTOR_PATH verify-bundle --policy "$bundleDirectory/policy.json" --audit "$bundleDirectory/audit.json" --reviewed-spki "$env:BRIDGE_READINESS_ROOT/root-spki.der" --expected-spki-sha256 $env:BRIDGE_TRUST_ROOT_SPKI_SHA256 --expected-previous-epoch 0 | Set-Content -NoNewline -Encoding utf8 "$env:BRIDGE_READINESS_ROOT/verified-bundle.json"
          if ($LASTEXITCODE -ne 0) { throw 'Production publisher bundle verification failed.' }
          [IO.File]::WriteAllBytes("$env:BRIDGE_READINESS_ROOT/trust-attestation.json", [Convert]::FromBase64String($env:BRIDGE_PRODUCTION_TRUST_ATTESTATION_B64))

      - name: Verify reviewed bridge readiness
        shell: pwsh
        env:
          BRIDGE_OBSERVATION_EVIDENCE_SHA256: ${{ vars.BRIDGE_OBSERVATION_EVIDENCE_SHA256 }}
          BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256: ${{ vars.BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256 }}
        run: |
          node $env:BRIDGE_READINESS_SCRIPT_PATH verify --stable-release "$env:BRIDGE_READINESS_ROOT/stable-release.json" --stable-artifact "$env:BRIDGE_READINESS_ROOT/stable-artifact.exe" --stable-checksum "$env:BRIDGE_READINESS_ROOT/stable-checksum.txt" --observation-evidence "$env:BRIDGE_READINESS_ROOT/observation-evidence.json" --observation-sha256 $env:BRIDGE_OBSERVATION_EVIDENCE_SHA256 --root-spki "$env:BRIDGE_READINESS_ROOT/root-spki.der" --policy "$env:BRIDGE_READINESS_ROOT/private-bundle/bundle/policy.json" --audit "$env:BRIDGE_READINESS_ROOT/private-bundle/bundle/audit.json" --verified-bundle "$env:BRIDGE_READINESS_ROOT/verified-bundle.json" --policy-release "$env:BRIDGE_READINESS_ROOT/policy-release.json" --trust-attestation "$env:BRIDGE_READINESS_ROOT/trust-attestation.json" --trust-attestation-sha256 $env:BRIDGE_PRODUCTION_TRUST_ATTESTATION_SHA256 | Set-Content -NoNewline -Encoding utf8 "$env:BRIDGE_READINESS_ROOT/readiness.json"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed bridge readiness verification failed.' }
          & $env:AUTHENTICODE_INSPECTOR_PATH verify-policy --root-spki "$env:BRIDGE_READINESS_ROOT/root-spki.der" --verified-bundle "$env:BRIDGE_READINESS_ROOT/verified-bundle.json" --epoch 1 --stable-artifact "$env:BRIDGE_READINESS_ROOT/stable-artifact.exe" --stable-tag v0.4.12 --stable-channel stable | Set-Content -NoNewline -Encoding utf8 "$env:BRIDGE_READINESS_ROOT/policy-authorization.json"
          if ($LASTEXITCODE -ne 0) { throw 'Production client policy authorization failed.' }
          $authorization = Get-Content "$env:BRIDGE_READINESS_ROOT/policy-authorization.json" -Raw | ConvertFrom-Json
          if ($authorization.stableIdentity.country -cne 'CN' -or $authorization.stableIdentity.organization -cne 'NaisNet Technology Co., Ltd.' -or $authorization.stableIdentity.organizationId -cne '91210103MA7CJ3C094') {
            throw 'Observed v0.4.12 signer identity differs from the separately reviewed NaisNet identity.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test -- --reporter=dot --minWorkers=2 --maxWorkers=2

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:ui

      - name: Prepare backend UI assets
        run: npm run prepare:go-assets

      - name: Resolve fixed signed FFmpeg component
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
        run: |
          $checkedManifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath goserver/ffmpeg/manifest.json).Hash.ToLowerInvariant()
          if ($checkedManifestHash -cne $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256) {
            throw 'Checked-in FFmpeg component manifest is not the reviewed bridge component.'
          }
          $checkedManifest = Get-Content goserver/ffmpeg/manifest.json -Raw | ConvertFrom-Json
          if ($checkedManifest.version -cne '9.0' -or $checkedManifest.authenticode -ne $true -or [string]::IsNullOrWhiteSpace([string]$checkedManifest.signer_subject)) {
            throw 'Checked-in FFmpeg component manifest is incomplete.'
          }
          $identity = node "$env:RELEASE_TOOL_ROOT/scripts/ffmpeg-component-assets.mjs" identity --kind fixed --tool-root $env:RELEASE_TOOL_ROOT | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $identity.schema -ne 2 -or $identity.fingerprint -cne $checkedManifest.component_fingerprint) {
            throw 'Fixed FFmpeg component identity does not match the checked-in reviewed manifest.'
          }
          "FFMPEG_COMPONENT_TAG=$($identity.tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_COMPONENT_FINGERPRINT=$($identity.fingerprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'FFMPEG_COMPONENT_EXISTS=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $encodedTag = [Uri]::EscapeDataString([string]$identity.tag)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            throw 'The fixed signed FFmpeg component Release is unavailable.'
          }
          New-Item -ItemType Directory -Force -Path dist/bridge-ffmpeg-component | Out-Null
          $release | ConvertTo-Json -Depth 10 | Set-Content -NoNewline -Encoding utf8 dist/bridge-ffmpeg-component-release.json
          gh release download $identity.tag --dir dist/bridge-ffmpeg-component --pattern ffmpeg.zip --pattern manifest.json --pattern gift-clip-test-tools.zip --pattern ffmpeg-9.0.tar.xz --pattern ffmpeg-9.0.tar.xz.asc --pattern ffmpeg-build-config.txt --pattern ffmpeg-component-gate.txt --pattern toolchain-lock.json --pattern NOTICE.md --pattern COPYING.LGPLv2.1 --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'The fixed signed FFmpeg component assets could not be downloaded.' }

      - name: Verify NaisNet FFmpeg component before packaging
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
        run: |
          $componentDirectory = 'dist/bridge-ffmpeg-component'
          node "$env:RELEASE_TOOL_ROOT/scripts/ffmpeg-component-assets.mjs" verify-metadata --tool-root $env:RELEASE_TOOL_ROOT --metadata dist/bridge-ffmpeg-component-release.json --input $componentDirectory --tag $env:FFMPEG_COMPONENT_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Fixed FFmpeg component metadata or download bytes failed verification.' }
          foreach ($asset in Get-ChildItem -LiteralPath $componentDirectory -File) {
            gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Fixed FFmpeg component attestation verification failed.' }
          }
          $componentManifest = Get-Content "$componentDirectory/manifest.json" -Raw | ConvertFrom-Json
          node "$env:RELEASE_TOOL_ROOT/scripts/ffmpeg-component-assets.mjs" verify --kind fixed --tool-root $env:RELEASE_TOOL_ROOT --input $componentDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Fixed signed FFmpeg component verification failed.' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$componentDirectory/manifest.json").Hash.ToLowerInvariant() -cne $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath goserver/ffmpeg/manifest.json).Hash.ToLowerInvariant() -cne $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath "$componentDirectory/ffmpeg.zip").Hash.ToLowerInvariant() -cne (Get-FileHash -Algorithm SHA256 -LiteralPath goserver/ffmpeg/ffmpeg.zip).Hash.ToLowerInvariant()) {
            throw 'The downloaded fixed FFmpeg component differs from the exact checked-in component.'
          }
          New-Item -ItemType Directory -Force -Path dist/bridge-ffmpeg-expanded | Out-Null
          Expand-Archive -LiteralPath goserver/ffmpeg/ffmpeg.zip -DestinationPath dist/bridge-ffmpeg-expanded
          $ffmpegPath = 'dist/bridge-ffmpeg-expanded/ffmpeg.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ffmpegPath).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $ffmpegPath).Length
          if ($componentManifest.sha256 -cne $hash -or [int64]$componentManifest.size -ne $size) {
            throw 'Fixed FFmpeg version/hash/size/AuthentiCode verification failed before packaging.'
          }
          & $env:AUTHENTICODE_INSPECTOR_PATH authenticode --file dist/bridge-ffmpeg-expanded/ffmpeg.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Fixed FFmpeg structured Authenticode inspection failed before packaging.' }
          "BRIDGE_FFMPEG_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BRIDGE_FFMPEG_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run backend tests
        working-directory: goserver
        run: go test ./...

      - name: Build bridge executable
        run: npm run build:exe
        env:
          APP_VERSION: v0.4.11
          APP_COMMIT: ${{ env.BRIDGE_COMMIT }}
          APP_UPDATE_API_URL: ${{ vars.UPDATE_API_BASE_URL }}
          APP_UPDATE_PUBLISHER: NaisNet Technology Co., Ltd.
          APP_UPDATE_TRUST_REQUIRED: '1'
          APP_UPDATE_TRUST_ROOT_SPKI_B64: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_B64 }}
          APP_UPDATE_TRUST_BOOTSTRAP_POLICY_B64: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_B64 }}

      - name: Verify NaisNet FFmpeg after packaging
        shell: pwsh
        env:
          BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
        run: |
          $componentManifest = Get-Content goserver/ffmpeg/manifest.json -Raw | ConvertFrom-Json
          $manifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath goserver/ffmpeg/manifest.json).Hash.ToLowerInvariant()
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath goserver/ffmpeg/ffmpeg.zip).Hash.ToLowerInvariant()
          $downloadArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/bridge-ffmpeg-component/ffmpeg.zip).Hash.ToLowerInvariant()
          $ffmpegPath = 'dist/bridge-ffmpeg-expanded/ffmpeg.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ffmpegPath).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $ffmpegPath).Length
          if ($componentManifest.version -cne '9.0' -or $manifestHash -cne $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 -or
              $archiveHash -cne $downloadArchiveHash -or $hash -cne $env:BRIDGE_FFMPEG_SHA256 -or $size -ne [int64]$env:BRIDGE_FFMPEG_SIZE -or
              $componentManifest.sha256 -cne $hash -or [int64]$componentManifest.size -ne $size) {
            throw 'Fixed FFmpeg changed during bridge packaging.'
          }
          & $env:AUTHENTICODE_INSPECTOR_PATH authenticode --file dist/bridge-ffmpeg-expanded/ffmpeg.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Fixed FFmpeg structured Authenticode inspection failed after packaging.' }
          Copy-Item -LiteralPath $ffmpegPath -Destination dist/ffmpeg-windows-x64.exe
          Copy-Item -LiteralPath goserver/ffmpeg/manifest.json -Destination dist/ffmpeg-component-manifest.json

      - name: Validate bridge signer profile
        shell: pwsh
        env:
          EVSIGN_BRIDGE_CERTIFICATE: ${{ vars.EVSIGN_BRIDGE_CERTIFICATE }}
          EVSIGN_BRIDGE_PUBLISHER_IDENTITY: ${{ vars.EVSIGN_BRIDGE_PUBLISHER_IDENTITY }}
        run: |
          $profile = node $env:EVSIGN_SCRIPT_PATH --resolve-profile bridge | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $profile.schema -ne 2 -or $profile.profile -cne 'bridge' -or $profile.certificateConfigured -ne $true) {
            throw 'The protected bridge signer profile is invalid.'
          }

      - name: Sign RushRush outer executable
        shell: pwsh
        env:
          EVSIGN_BRIDGE_CERTIFICATE: ${{ vars.EVSIGN_BRIDGE_CERTIFICATE }}
          EVSIGN_BRIDGE_PUBLISHER_IDENTITY: ${{ vars.EVSIGN_BRIDGE_PUBLISHER_IDENTITY }}
          EVSIGN_KEY: ${{ secrets.EVSIGN_BRIDGE_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_BRIDGE_PASSWORD }}
        run: |
          Copy-Item -LiteralPath dist/gift-panel.exe -Destination dist/gift-panel-windows-x64.unsigned.exe
          node $env:EVSIGN_SCRIPT_PATH --profile bridge dist/gift-panel-windows-x64.unsigned.exe dist/gift-panel-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'RushRush bridge outer signing failed.' }

      - name: Inspect final bound bridge artifact
        shell: pwsh
        env:
          BRIDGE_TRUST_ROOT_SPKI_SHA256: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_SHA256: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_EPOCH: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_EPOCH }}
        run: |
          & $env:AUTHENTICODE_INSPECTOR_PATH verify-artifact --unsigned dist/gift-panel-windows-x64.unsigned.exe --signed dist/gift-panel-windows-x64.exe --version 0.4.11 --tag v0.4.11 --commit $env:BRIDGE_COMMIT --root-spki "$env:BRIDGE_READINESS_ROOT/root-spki.der" --root-sha256 $env:BRIDGE_TRUST_ROOT_SPKI_SHA256 --policy "$env:BRIDGE_READINESS_ROOT/private-bundle/bundle/policy.json" --policy-sha256 $env:BRIDGE_BOOTSTRAP_POLICY_SHA256 --policy-epoch $env:BRIDGE_BOOTSTRAP_POLICY_EPOCH --stable-artifact "$env:BRIDGE_READINESS_ROOT/stable-artifact.exe" --stable-tag v0.4.12 --stable-channel stable --ffmpeg-archive goserver/ffmpeg/ffmpeg.zip --ffmpeg-manifest goserver/ffmpeg/manifest.json | Set-Content -NoNewline -Encoding utf8 dist/bridge-artifact-inspection.json
          if ($LASTEXITCODE -ne 0) { throw 'Final bound bridge artifact inspection failed.' }

      - name: Prepare public bridge evidence
        shell: pwsh
        env:
          BRIDGE_TRUST_ROOT_SPKI_SHA256: ${{ vars.BRIDGE_TRUST_ROOT_SPKI_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_SHA256: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_SHA256 }}
          BRIDGE_BOOTSTRAP_POLICY_EPOCH: ${{ vars.BRIDGE_BOOTSTRAP_POLICY_EPOCH }}
          BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
        run: |
          Copy-Item -LiteralPath gift-panel-changelog.json -Destination dist/gift-panel-changelog.json
          $changelog = Get-Content dist/gift-panel-changelog.json -Raw | ConvertFrom-Json
          if (@($changelog.releases | Where-Object { $_.version -ceq '0.4.11' }).Count -ne 1) {
            throw 'The bridge changelog must contain exactly one v0.4.11 entry.'
          }
          $inspection = Get-Content dist/bridge-artifact-inspection.json -Raw | ConvertFrom-Json
          $readiness = Get-Content "$env:BRIDGE_READINESS_ROOT/readiness.json" -Raw | ConvertFrom-Json
          if ($inspection.version -cne '0.4.11' -or $inspection.tag -cne $env:BRIDGE_TAG -or $inspection.commit -cne $env:BRIDGE_COMMIT -or
              $inspection.rootSpkiSha256 -cne $env:BRIDGE_TRUST_ROOT_SPKI_SHA256 -or $inspection.policySha256 -cne $env:BRIDGE_BOOTSTRAP_POLICY_SHA256 -or
              [uint64]$inspection.policyEpoch -ne [uint64]$env:BRIDGE_BOOTSTRAP_POLICY_EPOCH -or
              $inspection.outerIdentity.country -cne 'CN' -or $inspection.outerIdentity.organization -cne 'RushRush Network Technology Ltd' -or $inspection.outerIdentity.organizationId -cne '91450900MADM3GLG5P' -or
              $inspection.ffmpegIdentity.country -cne 'CN' -or $inspection.ffmpegIdentity.organization -cne 'NaisNet Technology Co., Ltd.' -or $inspection.ffmpegIdentity.organizationId -cne '91210103MA7CJ3C094' -or
              $readiness.rootSpkiSha256 -cne $inspection.rootSpkiSha256 -or $readiness.policySha256 -cne $inspection.policySha256 -or [uint64]$readiness.policyEpoch -ne [uint64]$inspection.policyEpoch) {
            throw 'Final artifact inspection and reviewed readiness evidence are inconsistent.'
          }
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash.ToLowerInvariant()
          $exeSize = (Get-Item -LiteralPath dist/gift-panel-windows-x64.exe).Length
          "$exeHash  gift-panel-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/gift-panel-windows-x64.exe.sha256
          [ordered]@{
            tag_name = $env:BRIDGE_TAG
            draft = $false
            prerelease = $false
            assets = @([ordered]@{
              name = 'gift-panel-windows-x64.exe'
              browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:BRIDGE_TAG/gift-panel-windows-x64.exe"
              size = $exeSize
              digest = "sha256:$exeHash"
            })
          } | ConvertTo-Json -Depth 6 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-update.json
          $ffmpegHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/ffmpeg-windows-x64.exe).Hash.ToLowerInvariant()
          $ffmpegSize = (Get-Item -LiteralPath dist/ffmpeg-windows-x64.exe).Length
          if ($ffmpegHash -cne $env:BRIDGE_FFMPEG_SHA256 -or $ffmpegSize -ne [int64]$env:BRIDGE_FFMPEG_SIZE) {
            throw 'Packaged FFmpeg differs from the pre-packaging verified component.'
          }
          $changelogHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-changelog.json).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/ffmpeg-component-manifest.json).Hash.ToLowerInvariant()
          if ($manifestHash -cne $env:BRIDGE_FFMPEG_COMPONENT_MANIFEST_SHA256) { throw 'Public component manifest hash changed.' }
          [ordered]@{
            schemaVersion = 1
            version = '0.4.11'
            tag = $env:BRIDGE_TAG
            commit = $env:BRIDGE_COMMIT
            latest = $false
            outerIdentity = [ordered]@{ country = [string]$inspection.outerIdentity.country; organization = [string]$inspection.outerIdentity.organization; organizationId = [string]$inspection.outerIdentity.organizationId; authenticode = 'Valid' }
            ffmpegIdentity = [ordered]@{ country = [string]$inspection.ffmpegIdentity.country; organization = [string]$inspection.ffmpegIdentity.organization; organizationId = [string]$inspection.ffmpegIdentity.organizationId; authenticode = 'Valid'; version = [string]$inspection.ffmpegVersion }
            peContentSha256 = [string]$inspection.peContentSha256
            rootSpkiSha256 = [string]$inspection.rootSpkiSha256
            bootstrapPolicyEpoch = [uint64]$inspection.policyEpoch
            bootstrapPolicySha256 = [string]$inspection.policySha256
            stableReleaseId = [int64]$readiness.stableReleaseId
            stablePublishedAt = [string]$readiness.stablePublishedAt
            stableArtifactSha256 = [string]$readiness.stableArtifactSha256
            observationEndedAt = [string]$readiness.observationEndedAt
            observationEvidenceSha256 = [string]$readiness.observationEvidenceSha256
            policyReleaseId = [int64]$readiness.policyReleaseId
            kmsKeyId = [string]$readiness.kmsKeyId
            kmsRequestId = [string]$readiness.kmsRequestId
            trustAttestationSha256 = [string]$readiness.trustAttestationSha256
            assets = @(
              [ordered]@{ name = 'gift-panel-windows-x64.exe'; sha256 = $exeHash; size = $exeSize },
              [ordered]@{ name = 'gift-panel-windows-x64.exe.sha256'; sha256 = (Get-FileHash -Algorithm SHA256 dist/gift-panel-windows-x64.exe.sha256).Hash.ToLowerInvariant(); size = (Get-Item dist/gift-panel-windows-x64.exe.sha256).Length },
              [ordered]@{ name = 'gift-panel-update.json'; sha256 = (Get-FileHash -Algorithm SHA256 dist/gift-panel-update.json).Hash.ToLowerInvariant(); size = (Get-Item dist/gift-panel-update.json).Length },
              [ordered]@{ name = 'ffmpeg-windows-x64.exe'; sha256 = $ffmpegHash; size = $ffmpegSize },
              [ordered]@{ name = 'gift-panel-changelog.json'; sha256 = $changelogHash; size = (Get-Item dist/gift-panel-changelog.json).Length },
              [ordered]@{ name = 'ffmpeg-component-manifest.json'; sha256 = $manifestHash; size = (Get-Item dist/ffmpeg-component-manifest.json).Length }
            )
          } | ConvertTo-Json -Depth 8 | Set-Content -NoNewline -Encoding utf8 dist/bridge-release-evidence.json
          $checksumPaths = @(
            'dist/gift-panel-windows-x64.exe',
            'dist/gift-panel-windows-x64.exe.sha256',
            'dist/gift-panel-update.json',
            'dist/ffmpeg-windows-x64.exe',
            'dist/gift-panel-changelog.json',
            'dist/ffmpeg-component-manifest.json',
            'dist/bridge-release-evidence.json'
          )
          $lines = foreach ($path in $checksumPaths) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $lines -join "`n" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS.txt
          $required = @(
            @('gift-panel-windows-x64.exe', 1001),
            @('gift-panel-windows-x64.exe.sha256', 1002),
            @('gift-panel-update.json', 1003),
            @('gift-panel-changelog.json', 1004)
          )
          $releaseAssets = foreach ($entry in $required) {
            $name = [string]$entry[0]
            $id = [int]$entry[1]
            $path = "dist/$name"
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            [ordered]@{
              url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$id"
              name = $name
              size = (Get-Item -LiteralPath $path).Length
              digest = "sha256:$hash"
              browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:BRIDGE_TAG/$name"
            }
          }
          [ordered]@{
            tag_name = $env:BRIDGE_TAG
            draft = $false
            prerelease = $false
            published_at = [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            assets = @($releaseAssets)
          } | ConvertTo-Json -Depth 6 | Set-Content -NoNewline -Encoding utf8 dist/local-bridge-release.json

      - name: Validate local bridge mirror closure
        run: go -C updateapi run ./cmd/release-closure --metadata ../dist/local-bridge-release.json --assets ../dist --tag v0.4.11

      - name: Attest bridge release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/gift-panel-windows-x64.exe
            dist/ffmpeg-windows-x64.exe
            dist/ffmpeg-component-manifest.json
            dist/bridge-release-evidence.json

      - name: Recheck reviewed bridge tag before draft
        shell: pwsh
        env:
          BRIDGE_REVIEWED_COMMIT_SHA: ${{ vars.BRIDGE_REVIEWED_COMMIT_SHA }}
          BRIDGE_REVIEWED_TAG_OBJECT_SHA: ${{ vars.BRIDGE_REVIEWED_TAG_OBJECT_SHA }}
        run: |
          if ($env:BRIDGE_REVIEWED_COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'reviewed bridge tag binding failed' }
          $localObject = git rev-parse refs/tags/v0.4.11
          $localCommit = git rev-parse refs/tags/v0.4.11^{commit}
          $remoteLines = @(git ls-remote origin refs/tags/v0.4.11 refs/tags/v0.4.11^{})
          if ($LASTEXITCODE -ne 0 -or $remoteLines.Count -lt 1 -or $remoteLines.Count -gt 2) { throw 'reviewed bridge tag binding failed' }
          $remote = @{}
          foreach ($line in $remoteLines) {
            $parts = $line -split "`t", 2
            if ($parts.Count -ne 2 -or $parts[0] -cnotmatch '^[0-9a-f]{40}$' -or $remote.ContainsKey($parts[1]) -or $parts[1] -notin @('refs/tags/v0.4.11','refs/tags/v0.4.11^{}')) { throw 'reviewed bridge tag binding failed' }
            $remote[$parts[1]] = $parts[0]
          }
          if (-not $remote.ContainsKey('refs/tags/v0.4.11') -or $remote['refs/tags/v0.4.11'] -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -or $localObject -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($remote.ContainsKey('refs/tags/v0.4.11^{}')) { if ($remoteLines.Count -ne 2 -or $remote['refs/tags/v0.4.11^{}'] -cne $env:BRIDGE_REVIEWED_COMMIT_SHA -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -ceq $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' } }
          elseif ($remoteLines.Count -ne 1 -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($localCommit -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }

      - name: Create immutable-shaped bridge draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:BRIDGE_TAG --draft --verify-tag --title $env:BRIDGE_TAG --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Bridge GitHub Release draft creation failed.' }
          gh release upload $env:BRIDGE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/ffmpeg-windows-x64.exe dist/gift-panel-changelog.json dist/ffmpeg-component-manifest.json dist/bridge-release-evidence.json dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bridge asset upload failed; the draft remains unpublished.' }

      - name: Read back and verify bridge draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:BRIDGE_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          $required = @('gift-panel-windows-x64.exe','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','ffmpeg-windows-x64.exe','gift-panel-changelog.json','ffmpeg-component-manifest.json','bridge-release-evidence.json','SHA256SUMS.txt')
          $names = @($release.assets | ForEach-Object { [string]$_.name })
          if ($release.tag_name -cne $env:BRIDGE_TAG -or -not $release.draft -or $release.prerelease -or $names.Count -ne $required.Count) {
            throw 'Bridge draft metadata is not the exact immutable-shaped closure.'
          }
          foreach ($name in $required) {
            if (@($names | Where-Object { $_ -ceq $name }).Count -ne 1) { throw 'Bridge draft asset names are not an exact set.' }
          }
          New-Item -ItemType Directory -Force -Path dist/bridge-draft-readback | Out-Null
          foreach ($name in $required) {
            gh release download $env:BRIDGE_TAG --dir dist/bridge-draft-readback --pattern $name
            if ($LASTEXITCODE -ne 0) { throw 'Bridge draft asset readback failed.' }
            $source = "dist/$name"
            $readback = "dist/bridge-draft-readback/$name"
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })[0]
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $readback).Hash.ToLowerInvariant() -cne $hash -or
                (Get-Item -LiteralPath $readback).Length -ne (Get-Item -LiteralPath $source).Length -or
                [int64]$asset.size -ne (Get-Item -LiteralPath $source).Length -or [string]$asset.digest -cne "sha256:$hash") {
              throw 'Bridge draft asset digest, size, or downloaded bytes differ.'
            }
          }

      - name: Recheck reviewed bridge tag before publication
        shell: pwsh
        env:
          BRIDGE_REVIEWED_COMMIT_SHA: ${{ vars.BRIDGE_REVIEWED_COMMIT_SHA }}
          BRIDGE_REVIEWED_TAG_OBJECT_SHA: ${{ vars.BRIDGE_REVIEWED_TAG_OBJECT_SHA }}
        run: |
          if ($env:BRIDGE_REVIEWED_COMMIT_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'reviewed bridge tag binding failed' }
          $localObject = git rev-parse refs/tags/v0.4.11
          $localCommit = git rev-parse refs/tags/v0.4.11^{commit}
          $remoteLines = @(git ls-remote origin refs/tags/v0.4.11 refs/tags/v0.4.11^{})
          if ($LASTEXITCODE -ne 0 -or $remoteLines.Count -lt 1 -or $remoteLines.Count -gt 2) { throw 'reviewed bridge tag binding failed' }
          $remote = @{}
          foreach ($line in $remoteLines) {
            $parts = $line -split "`t", 2
            if ($parts.Count -ne 2 -or $parts[0] -cnotmatch '^[0-9a-f]{40}$' -or $remote.ContainsKey($parts[1]) -or $parts[1] -notin @('refs/tags/v0.4.11','refs/tags/v0.4.11^{}')) { throw 'reviewed bridge tag binding failed' }
            $remote[$parts[1]] = $parts[0]
          }
          if (-not $remote.ContainsKey('refs/tags/v0.4.11') -or $remote['refs/tags/v0.4.11'] -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -or $localObject -cne $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($remote.ContainsKey('refs/tags/v0.4.11^{}')) { if ($remoteLines.Count -ne 2 -or $remote['refs/tags/v0.4.11^{}'] -cne $env:BRIDGE_REVIEWED_COMMIT_SHA -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -ceq $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' } }
          elseif ($remoteLines.Count -ne 1 -or $env:BRIDGE_REVIEWED_TAG_OBJECT_SHA -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }
          if ($localCommit -cne $env:BRIDGE_REVIEWED_COMMIT_SHA) { throw 'reviewed bridge tag binding failed' }

      - name: Publish bridge as non-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:BRIDGE_TAG --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Bridge GitHub Release publication failed.' }

      - name: Verify published bridge remains non-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:BRIDGE_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          if ($release.tag_name -cne $env:BRIDGE_TAG -or $release.draft -or $release.prerelease -or -not $release.published_at) {
            throw 'Published bridge metadata is incomplete.'
          }
          $latest = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
          if ($latest.id -eq $release.id -or $latest.tag_name -ceq $env:BRIDGE_TAG) {
            throw 'The bridge Release incorrectly became GitHub latest.'
          }
          $required = @('gift-panel-windows-x64.exe','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','ffmpeg-windows-x64.exe','gift-panel-changelog.json','ffmpeg-component-manifest.json','bridge-release-evidence.json','SHA256SUMS.txt')
          $names = @($release.assets | ForEach-Object { [string]$_.name })
          if ($names.Count -ne $required.Count) { throw 'Published bridge asset closure changed.' }
          New-Item -ItemType Directory -Force -Path dist/bridge-published-readback | Out-Null
          foreach ($name in $required) {
            if (@($names | Where-Object { $_ -ceq $name }).Count -ne 1) { throw 'Published bridge asset names changed.' }
            gh release download $env:BRIDGE_TAG --dir dist/bridge-published-readback --pattern $name
            if ($LASTEXITCODE -ne 0) { throw 'Published bridge asset readback failed.' }
            $source = "dist/$name"
            $readback = "dist/bridge-published-readback/$name"
            $asset = @($release.assets | Where-Object { $_.name -ceq $name })[0]
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $readback).Hash.ToLowerInvariant() -cne $hash -or
                (Get-Item -LiteralPath $readback).Length -ne (Get-Item -LiteralPath $source).Length -or
                [int64]$asset.size -ne (Get-Item -LiteralPath $source).Length -or [string]$asset.digest -cne "sha256:$hash") {
              throw 'Published bridge asset digest, size, or downloaded bytes differ.'
            }
          }
