name: Publisher policy rotation

on:
  workflow_dispatch:
    inputs:
      candidate_epoch:
        description: Exact publisher-policy epoch to sign and publish
        required: true
        type: number
      expected_previous_epoch:
        description: Exact previously published publisher-policy epoch
        required: true
        type: number
      advance_discovery:
        description: Advance both dedicated trust discovery pointers after immutable verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publisher-policy-rotation
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: updateapi/go.mod
          cache-dependency-path: updateapi/go.sum
      - name: Validate exact reviewed candidate without credentials
        shell: bash
        env:
          CANDIDATE_EPOCH: ${{ inputs.candidate_epoch }}
          EXPECTED_PREVIOUS_EPOCH: ${{ inputs.expected_previous_epoch }}
        run: |
          set -euo pipefail
          candidate_path=$(printf 'publisher/policy-candidates/epoch-%08d.json' "$CANDIDATE_EPOCH")
          go -C updateapi run ./cmd/trustpolicy validate-candidate \
            --candidate "../$candidate_path" \
            --candidate-epoch "$CANDIDATE_EPOCH" \
            --expected-previous-epoch "$EXPECTED_PREVIOUS_EPOCH"
          install -d -m 700 "$RUNNER_TEMP/publisher-candidate"
          install -m 600 "$candidate_path" "$RUNNER_TEMP/publisher-candidate/candidate.json"
      - name: Export reviewed public candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-policy-candidate
          path: ${{ runner.temp }}/publisher-candidate/candidate.json
          if-no-files-found: error
          retention-days: 1

  sign-policy:
    needs: validate-candidate
    runs-on: ubuntu-latest
    environment: publisher-rotation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: updateapi/go.mod
          cache-dependency-path: updateapi/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download reviewed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publisher-policy-candidate
          path: ${{ runner.temp }}/publisher-candidate
      - name: Exchange reviewed GitHub OIDC for KMS-only Tencent session
        id: kms-session
        shell: bash
        env:
          PUBLISHER_TENCENT_ROLE_ARN: ${{ vars.PUBLISHER_KMS_ROLE_ARN }}
          PUBLISHER_TENCENT_OIDC_PROVIDER_ID: ${{ vars.PUBLISHER_TENCENT_OIDC_PROVIDER_ID }}
          PUBLISHER_TENCENT_OIDC_AUDIENCE: ${{ vars.PUBLISHER_TENCENT_OIDC_AUDIENCE }}
        run: node scripts/publish-trust-policy.mjs exchange-session
      - name: Sign publisher policy
        shell: bash
        env:
          GIFT_PANEL_KMS_PROVIDER_MODE: environment-session
          TENCENTCLOUD_SECRET_ID: ${{ steps.kms-session.outputs.secret-id }}
          TENCENTCLOUD_SECRET_KEY: ${{ steps.kms-session.outputs.secret-key }}
          TENCENTCLOUD_SESSION_TOKEN: ${{ steps.kms-session.outputs.session-token }}
          REVIEWED_KMS_KEY_ID: ${{ vars.PUBLISHER_ROTATION_KMS_KEY_ID }}
          REVIEWED_KMS_SPKI_SHA256: ${{ vars.PUBLISHER_ROTATION_SPKI_SHA256 }}
          EXPECTED_PREVIOUS_EPOCH: ${{ inputs.expected_previous_epoch }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/publisher-output"
          go -C updateapi run ./cmd/trustpolicy sign \
            --candidate "$RUNNER_TEMP/publisher-candidate/candidate.json" \
            --expected-previous-epoch "$EXPECTED_PREVIOUS_EPOCH" \
            --kms-region ap-shanghai \
            --kms-key-id-env REVIEWED_KMS_KEY_ID \
            --expected-spki-sha256-env REVIEWED_KMS_SPKI_SHA256 \
            --output "$RUNNER_TEMP/publisher-output/bundle/policy.json" \
            --audit-output "$RUNNER_TEMP/publisher-output/bundle/audit.json"
      - name: Verify signed bundle before handoff
        shell: bash
        env:
          PUBLISHER_MODE: dry-run
          PUBLISHER_POLICY_PATH: ${{ runner.temp }}/publisher-output/bundle/policy.json
          PUBLISHER_AUDIT_PATH: ${{ runner.temp }}/publisher-output/bundle/audit.json
          PUBLISHER_ROTATION_SPKI_PATH: ${{ vars.PUBLISHER_ROTATION_SPKI_PATH }}
          PUBLISHER_ROTATION_SPKI_SHA256: ${{ vars.PUBLISHER_ROTATION_SPKI_SHA256 }}
          PUBLISHER_EXPECTED_PREVIOUS_EPOCH: ${{ inputs.expected_previous_epoch }}
          PUBLISHER_ADVANCE_DISCOVERY: 'false'
        run: node scripts/publish-trust-policy.mjs run
      - name: Export signed public bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publisher-policy-bundle
          path: ${{ runner.temp }}/publisher-output/bundle
          if-no-files-found: error
          retention-days: 1

  publish-immutable:
    needs: sign-policy
    runs-on: ubuntu-latest
    environment: publisher-rotation
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: updateapi/go.mod
          cache-dependency-path: updateapi/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download signed public bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publisher-policy-bundle
          path: ${{ runner.temp }}/publisher-output/bundle
      - name: Reapply private bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$RUNNER_TEMP/publisher-output" "$RUNNER_TEMP/publisher-output/bundle"
          chmod 600 "$RUNNER_TEMP/publisher-output/bundle/policy.json" "$RUNNER_TEMP/publisher-output/bundle/audit.json" "$RUNNER_TEMP/publisher-output/bundle/commit.json"
      - name: Exchange reviewed GitHub OIDC for COS-only Tencent session
        id: cos-session
        shell: bash
        env:
          PUBLISHER_TENCENT_ROLE_ARN: ${{ vars.PUBLISHER_COS_ROLE_ARN }}
          PUBLISHER_TENCENT_OIDC_PROVIDER_ID: ${{ vars.PUBLISHER_TENCENT_OIDC_PROVIDER_ID }}
          PUBLISHER_TENCENT_OIDC_AUDIENCE: ${{ vars.PUBLISHER_TENCENT_OIDC_AUDIENCE }}
        run: node scripts/publish-trust-policy.mjs exchange-session
      - name: Publish and re-read immutable trust artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          COS_BUCKET: ${{ vars.PUBLISHER_COS_BUCKET }}
          COS_REGION: ${{ vars.PUBLISHER_COS_REGION }}
          TENCENTCLOUD_SECRET_ID: ${{ steps.cos-session.outputs.secret-id }}
          TENCENTCLOUD_SECRET_KEY: ${{ steps.cos-session.outputs.secret-key }}
          TENCENTCLOUD_SESSION_TOKEN: ${{ steps.cos-session.outputs.session-token }}
          PUBLISHER_MODE: publish-immutable
          PUBLISHER_POLICY_PATH: ${{ runner.temp }}/publisher-output/bundle/policy.json
          PUBLISHER_AUDIT_PATH: ${{ runner.temp }}/publisher-output/bundle/audit.json
          PUBLISHER_ROTATION_SPKI_PATH: ${{ vars.PUBLISHER_ROTATION_SPKI_PATH }}
          PUBLISHER_ROTATION_SPKI_SHA256: ${{ vars.PUBLISHER_ROTATION_SPKI_SHA256 }}
          PUBLISHER_EXPECTED_PREVIOUS_EPOCH: ${{ inputs.expected_previous_epoch }}
          PUBLISHER_ADVANCE_DISCOVERY: 'false'
        run: node scripts/publish-trust-policy.mjs run

  advance-discovery:
    needs: publish-immutable
    if: ${{ inputs.advance_discovery == true }}
    runs-on: ubuntu-latest
    environment: publisher-rotation
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: updateapi/go.mod
          cache-dependency-path: updateapi/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Download signed public bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publisher-policy-bundle
          path: ${{ runner.temp }}/publisher-output/bundle
      - name: Reapply private bundle permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$RUNNER_TEMP/publisher-output" "$RUNNER_TEMP/publisher-output/bundle"
          chmod 600 "$RUNNER_TEMP/publisher-output/bundle/policy.json" "$RUNNER_TEMP/publisher-output/bundle/audit.json" "$RUNNER_TEMP/publisher-output/bundle/commit.json"
      - name: Exchange reviewed GitHub OIDC for COS-only Tencent session
        id: cos-session
        shell: bash
        env:
          PUBLISHER_TENCENT_ROLE_ARN: ${{ vars.PUBLISHER_COS_ROLE_ARN }}
          PUBLISHER_TENCENT_OIDC_PROVIDER_ID: ${{ vars.PUBLISHER_TENCENT_OIDC_PROVIDER_ID }}
          PUBLISHER_TENCENT_OIDC_AUDIENCE: ${{ vars.PUBLISHER_TENCENT_OIDC_AUDIENCE }}
        run: node scripts/publish-trust-policy.mjs exchange-session
      - name: Re-verify immutable artifacts and advance fixed discovery pointers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          COS_BUCKET: ${{ vars.PUBLISHER_COS_BUCKET }}
          COS_REGION: ${{ vars.PUBLISHER_COS_REGION }}
          TENCENTCLOUD_SECRET_ID: ${{ steps.cos-session.outputs.secret-id }}
          TENCENTCLOUD_SECRET_KEY: ${{ steps.cos-session.outputs.secret-key }}
          TENCENTCLOUD_SESSION_TOKEN: ${{ steps.cos-session.outputs.session-token }}
          PUBLISHER_MODE: advance-discovery
          PUBLISHER_POLICY_PATH: ${{ runner.temp }}/publisher-output/bundle/policy.json
          PUBLISHER_AUDIT_PATH: ${{ runner.temp }}/publisher-output/bundle/audit.json
          PUBLISHER_ROTATION_SPKI_PATH: ${{ vars.PUBLISHER_ROTATION_SPKI_PATH }}
          PUBLISHER_ROTATION_SPKI_SHA256: ${{ vars.PUBLISHER_ROTATION_SPKI_SHA256 }}
          PUBLISHER_EXPECTED_PREVIOUS_EPOCH: ${{ inputs.expected_previous_epoch }}
          PUBLISHER_ADVANCE_DISCOVERY: 'true'
        run: node scripts/publish-trust-policy.mjs run
