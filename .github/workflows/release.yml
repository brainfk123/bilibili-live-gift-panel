name: Release Windows executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Install pinned native toolchain
        shell: pwsh
        run: |
          choco install mingw --version 13.2.0 --yes --no-progress --allow-downgrade
          choco install cmake --version 3.31.8 --yes --no-progress --allow-downgrade
          choco install ninja --version 1.12.1 --yes --no-progress --allow-downgrade
          Import-Module "$env:ChocolateyInstall/helpers/chocolateyProfile.psm1"
          Update-SessionEnvironment
          @('gcc', 'g++', 'cmake', 'ninja', 'objdump') | ForEach-Object {
            $tool = Get-Command $_ -ErrorAction Stop
            Split-Path -Parent $tool.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Run tests
        run: npm test -- --reporter=dot

      - name: Type check
        run: npm run typecheck

      - name: Verify generated assistant knowledge
        run: npm run check:assistant-help

      - name: Verify hosted assistant model manifest
        shell: pwsh
        env:
          ASSISTANT_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.ASSISTANT_MANIFEST_PUBLIC_KEY_BASE64 }}
          ASSISTANT_MANIFEST_URL: ${{ vars.ASSISTANT_MANIFEST_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ASSISTANT_MANIFEST_URL)) {
            throw "The repository is missing ASSISTANT_MANIFEST_URL."
          }
          node scripts/verify-assistant-manifest.mjs $env:ASSISTANT_MANIFEST_URL

      - name: Build frontend
        run: npm run build:ui

      - name: Build pinned llama.cpp CPU runtime
        run: npm run build:llama

      - name: Compile native assistant Adapter
        working-directory: goserver
        run: go test -tags llamacpp ./assistant/llamacpp
        env:
          CGO_ENABLED: '1'
          CC: gcc
          CXX: g++

      - name: Build release executable
        run: npm run build:exe:native
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          APP_COMMIT: ${{ github.sha }}
          ASSISTANT_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.ASSISTANT_MANIFEST_PUBLIC_KEY_BASE64 }}
          ASSISTANT_MANIFEST_URL: ${{ vars.ASSISTANT_MANIFEST_URL }}
          REQUIRE_ASSISTANT_TRUST: '1'

      - name: Verify native runtime is statically linked
        run: npm run verify:exe-static -- dist/gift-panel.exe

      - name: Run backend tests
        working-directory: goserver
        run: go test ./...

      - name: Prepare and sign release executable
        shell: pwsh
        env:
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_PASSWORD }}
          EVSIGN_CERT: ${{ vars.EVSIGN_CERT }}
        run: |
          Copy-Item -LiteralPath dist/gift-panel.exe -Destination dist/gift-panel-windows-x64.exe
          node scripts/sign-evsign.mjs dist/gift-panel-windows-x64.exe

          $signature = Get-AuthenticodeSignature -LiteralPath dist/gift-panel-windows-x64.exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }
          Write-Host "Verified Authenticode signer: $($signature.SignerCertificate.Subject)"

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination dist/THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath third_party/licenses/llama.cpp-MIT.txt -Destination dist/llama.cpp-MIT.txt
          Copy-Item -LiteralPath third_party/licenses/Qwen3-Apache-2.0.txt -Destination dist/Qwen3-Apache-2.0.txt
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath dist/gift-panel-windows-x64.exe).Length
          "$hash  gift-panel-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/gift-panel-windows-x64.exe.sha256
          @{
            tag_name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            assets = @(
              @{
                name = "gift-panel-windows-x64.exe"
                browser_download_url = "https://github.com/brainfk123/bilibili-live-gift-panel/releases/download/$env:RELEASE_TAG/gift-panel-windows-x64.exe"
                size = $size
                digest = "sha256:$hash"
              }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-update.json
          $currentChangelog = Get-Content gift-panel-changelog.json -Raw | ConvertFrom-Json
          $releaseHistory = @()
          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -and $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          if ($previousTag) {
            try {
              $previousChangelog = Invoke-RestMethod -Uri "https://github.com/brainfk123/bilibili-live-gift-panel/releases/download/$previousTag/gift-panel-changelog.json" -TimeoutSec 20
              $releaseHistory = @($previousChangelog.releases)
            } catch {
              Write-Host "No hosted changelog exists for $previousTag; reading its bundled changelog from Git history."
              $previousChangelogJson = git show "${previousTag}:gift-panel-changelog.json" 2>$null
              $gitShowExitCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($gitShowExitCode -eq 0 -and $previousChangelogJson) {
                $previousChangelog = $previousChangelogJson | ConvertFrom-Json
                $releaseHistory = @($previousChangelog.releases)
              } else {
                Write-Host "No previous changelog is available; publishing the bundled current release only."
              }
            }
          }
          $historySeed = @()
          if (Test-Path .github/changelog-history.json) {
            $historySeedDocument = Get-Content .github/changelog-history.json -Raw | ConvertFrom-Json
            $historySeed = @($historySeedDocument.releases)
          } else {
            try {
              $historySeedDocument = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/brainfk123/bilibili-live-gift-panel/master/.github/changelog-history.json" -TimeoutSec 20
              $historySeed = @($historySeedDocument.releases)
            } catch {
              Write-Host "No changelog history seed is available."
            }
          }
          $seenVersions = @{}
          $mergedReleases = @()
          foreach ($release in @($currentChangelog.releases) + $releaseHistory + $historySeed) {
            $version = [string]$release.version
            if ($version -and -not $seenVersions.ContainsKey($version)) {
              $seenVersions[$version] = $true
              $mergedReleases += $release
            }
          }
          @{
            schemaVersion = 1
            releases = $mergedReleases
          } | ConvertTo-Json -Depth 8 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-changelog.json

      - name: Attest executable provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/gift-panel-windows-x64.exe

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/gift-panel-changelog.json dist/THIRD_PARTY_NOTICES.md dist/llama.cpp-MIT.txt dist/Qwen3-Apache-2.0.txt --clobber
            gh release edit $env:RELEASE_TAG --draft=false --latest
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/gift-panel-changelog.json dist/THIRD_PARTY_NOTICES.md dist/llama.cpp-MIT.txt dist/Qwen3-Apache-2.0.txt
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
