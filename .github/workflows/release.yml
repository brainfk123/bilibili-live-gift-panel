name: Release Windows executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: gift-panel-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "Release tag must use canonical vMAJOR.MINOR.PATCH syntax"
          }
          $releaseVersion = [Version]$env:RELEASE_TAG.Substring(1)
          $standaloneFFmpeg = $releaseVersion -ge [Version]'0.4.10'
          "RELEASE_STANDALONE_FFMPEG=$($standaloneFFmpeg.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve checked-out release commit
        shell: pwsh
        run: |
          $releaseCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve checked-out release commit" }
          "RELEASE_COMMIT=$releaseCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect existing GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode -eq [Net.HttpStatusCode]::NotFound) {
              'RELEASE_EXISTS=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
            throw "GitHub Release lookup failed"
          }
          if ($release.draft -or $release.prerelease -or -not $release.published_at) {
            throw "Existing GitHub Release is incomplete. Manual recovery required before rerunning."
          }

          try {
            $publishedAt = [DateTimeOffset]$release.published_at
          } catch {
            throw "Existing GitHub Release publication timestamp is invalid. Manual recovery required before rerunning."
          }
          'RELEASE_EXISTS=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download existing release assets
        if: env.RELEASE_EXISTS == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download $env:RELEASE_TAG --dir dist --pattern gift-panel-windows-x64.exe --pattern gift-panel-windows-x64.exe.sha256 --pattern gift-panel-update.json --pattern gift-panel-changelog.json
          if ($LASTEXITCODE -ne 0) { throw "Existing GitHub Release assets could not be downloaded. Manual recovery required." }
          $requiredPaths = @('dist/gift-panel-windows-x64.exe', 'dist/gift-panel-windows-x64.exe.sha256', 'dist/gift-panel-update.json', 'dist/gift-panel-changelog.json')
          if ($env:RELEASE_STANDALONE_FFMPEG -eq 'true') {
            gh release download $env:RELEASE_TAG --dir dist --pattern ffmpeg-windows-x64.exe --pattern ffmpeg-windows-x64.exe.sha256
            if ($LASTEXITCODE -ne 0) { throw "Existing GitHub Release standalone FFmpeg assets could not be downloaded. Manual recovery required." }
            $requiredPaths += @('dist/ffmpeg-windows-x64.exe', 'dist/ffmpeg-windows-x64.exe.sha256')
          }
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Existing GitHub Release is missing required assets. Manual recovery required."
            }
          }

      - name: Set up Node.js
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: updateapi/go.mod
          cache-dependency-path: updateapi/go.sum

      - name: Resolve EVSign signer profile
        shell: pwsh
        env:
          EVSIGN_CERTIFICATE: ${{ vars.EVSIGN_CERTIFICATE }}
          EVSIGN_PUBLISHER_IDENTITY: ${{ vars.EVSIGN_PUBLISHER_IDENTITY }}
        run: |
          $profileJSON = node scripts/sign-evsign.mjs --resolve-profile stable
          if ($LASTEXITCODE -ne 0) { throw "EVSign signer profile resolution failed" }
          $profile = $profileJSON | ConvertFrom-Json
          if ($profile.schema -ne 2 -or $profile.profile -cne 'stable' -or $profile.certificateConfigured -ne $true) {
            throw "EVSign signer profile output is invalid"
          }
          "APP_UPDATE_PUBLISHER=NaisNet Technology Co., Ltd." | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved closed EVSign signer profile '$($profile.profile)'."

      - name: Test domestic update tooling
        env:
          GOWORK: 'off'
        run: go -C updateapi test ./... -race -count=1

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        if: env.RELEASE_EXISTS != 'true'
        run: npm ci

      - name: Install pinned Playwright Chromium for release E2E
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .cache | Out-Null
          npm exec -- playwright install chromium

      - name: Run tests
        if: env.RELEASE_EXISTS != 'true'
        run: npm test -- --reporter=dot --minWorkers=2 --maxWorkers=2

      - name: Type check
        if: env.RELEASE_EXISTS != 'true'
        run: npm run typecheck

      - name: Build frontend
        if: env.RELEASE_EXISTS != 'true'
        run: npm run build:ui

      - name: Prepare backend UI assets
        if: env.RELEASE_EXISTS != 'true'
        run: npm run prepare:go-assets

      - name: Resolve FFmpeg component identity
        if: env.RELEASE_EXISTS != 'true' || env.RELEASE_STANDALONE_FFMPEG == 'true'
        shell: pwsh
        run: |
          $componentSignerSubject = [string](Get-Content goserver/ffmpeg/manifest.json -Raw | ConvertFrom-Json).signer_subject
          if ([string]::IsNullOrWhiteSpace($componentSignerSubject)) { throw 'Reviewed FFmpeg component signer metadata is missing.' }
          $env:EVSIGN_EXPECTED_SUBJECT = $componentSignerSubject
          "EVSIGN_EXPECTED_SUBJECT=$componentSignerSubject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $identityJSON = node scripts/ffmpeg-component-assets.mjs identity
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component identity resolution failed" }
          $identity = $identityJSON | ConvertFrom-Json
          if ($identity.schema -ne 2 -or [string]$identity.fingerprint -cnotmatch '^[0-9a-f]{64}$' -or [string]$identity.tag -cne "ffmpeg-component-v2-$($identity.fingerprint)") {
            throw "FFmpeg component identity output is invalid"
          }
          "FFMPEG_COMPONENT_FINGERPRINT=$($identity.fingerprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_COMPONENT_TAG=$($identity.tag)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect signed FFmpeg component
        if: env.RELEASE_EXISTS != 'true' || env.RELEASE_STANDALONE_FFMPEG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $encodedTag = [Uri]::EscapeDataString($env:FFMPEG_COMPONENT_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode -eq [Net.HttpStatusCode]::NotFound) {
              if ($env:RELEASE_EXISTS -eq 'true' -and $env:RELEASE_STANDALONE_FFMPEG -eq 'true') {
                throw "Existing Release repair requires its immutable signed FFmpeg component. Manual recovery required."
              }
              'FFMPEG_COMPONENT_EXISTS=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
            throw "FFmpeg component lookup failed without an exact 404"
          }
          $requiredAssets = @('ffmpeg.zip','manifest.json','gift-clip-test-tools.zip','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','SHA256SUMS.txt')
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($release.tag_name -cne $env:FFMPEG_COMPONENT_TAG -or $release.draft -or $release.prerelease -or -not $release.published_at -or $assetNames.Count -ne $requiredAssets.Count) {
            throw "Existing FFmpeg component Release is incomplete. Manual recovery required."
          }
          foreach ($name in $requiredAssets) {
            if (@($assetNames | Where-Object { $_ -ceq $name }).Count -ne 1) { throw "Existing FFmpeg component asset closure is invalid. Manual recovery required." }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $release | ConvertTo-Json -Depth 10 | Set-Content -NoNewline -Encoding utf8 dist/ffmpeg-component-release.json
          'FFMPEG_COMPONENT_EXISTS=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download signed FFmpeg component
        if: env.FFMPEG_COMPONENT_EXISTS == 'true' && (env.RELEASE_EXISTS != 'true' || env.RELEASE_STANDALONE_FFMPEG == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/ffmpeg-component-download | Out-Null
          gh release download $env:FFMPEG_COMPONENT_TAG --dir dist/ffmpeg-component-download --pattern ffmpeg.zip --pattern manifest.json --pattern gift-clip-test-tools.zip --pattern ffmpeg-9.0.tar.xz --pattern ffmpeg-9.0.tar.xz.asc --pattern ffmpeg-build-config.txt --pattern ffmpeg-component-gate.txt --pattern toolchain-lock.json --pattern NOTICE.md --pattern COPYING.LGPLv2.1 --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Signed FFmpeg component download failed" }

      - name: Verify standalone FFmpeg repair component
        if: env.RELEASE_EXISTS == 'true' && env.RELEASE_STANDALONE_FFMPEG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $componentDirectory = 'dist/ffmpeg-component-download'
          node scripts/ffmpeg-component-assets.mjs verify-metadata --metadata dist/ffmpeg-component-release.json --input $componentDirectory --tag $env:FFMPEG_COMPONENT_TAG
          if ($LASTEXITCODE -ne 0) { throw "Repair FFmpeg component GitHub metadata or digest verification failed" }
          foreach ($asset in Get-ChildItem -LiteralPath $componentDirectory -File) {
            gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Repair FFmpeg component attestation verification failed for $($asset.Name)" }
          }
          node scripts/ffmpeg-component-assets.mjs verify --input $componentDirectory
          if ($LASTEXITCODE -ne 0) { throw "Repair signed FFmpeg component verification failed" }
          Copy-Item -LiteralPath "$componentDirectory/manifest.json" -Destination dist/standalone-component-manifest.json

      - name: Set up MSYS2 host environment
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          cache: false

      - name: Build and verify pinned FFmpeg
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        run: |
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $env:PATH = "$env:SystemRoot\System32;$msys2Root\usr\bin;$env:PATH"
          npm run build:ffmpeg -- -Msys2Root $msys2Root -InstallPinnedToolchain -BuildGiftClipTestTools
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned FFmpeg build failed with exit code $LASTEXITCODE"
          }
          npm run verify:ffmpeg
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg verification failed with exit code $LASTEXITCODE"
          }

      - name: Sign and verify inner FFmpeg
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        env:
          EVSIGN_CERTIFICATE: ${{ vars.EVSIGN_CERTIFICATE }}
          EVSIGN_PUBLISHER_IDENTITY: ${{ vars.EVSIGN_PUBLISHER_IDENTITY }}
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_PASSWORD }}
        run: |
          node scripts/sign-evsign.mjs --profile stable dist/ffmpeg/ffmpeg.exe
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg signing failed with exit code $LASTEXITCODE"
          }
          go -C goserver run ./cmd/artifact-inspector authenticode --file ../dist/ffmpeg/ffmpeg.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Inner FFmpeg structured Authenticode inspection failed.' }
          Write-Host 'Verified inner FFmpeg Authenticode signature.'

      - name: Package and verify signed FFmpeg payload
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        env:
          FFMPEG_AUTHENTICODE: 'true'
          APP_VERSION: ${{ env.RELEASE_TAG }}
          APP_COMMIT: ${{ env.RELEASE_COMMIT }}
        run: |
          node scripts/package-ffmpeg.mjs --input dist/ffmpeg/ffmpeg.exe
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg packaging failed with exit code $LASTEXITCODE"
          }
          npm run verify:ffmpeg
          if ($LASTEXITCODE -ne 0) {
            throw "Signed FFmpeg payload verification failed with exit code $LASTEXITCODE"
          }

      - name: Package signed FFmpeg component
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist/gift-clip-test-tools/ffmpeg.exe,dist/gift-clip-test-tools/ffprobe.exe,dist/gift-clip-test-tools/manifest.json -DestinationPath dist/gift-clip-test-tools.zip -CompressionLevel Optimal
          node scripts/ffmpeg-component-assets.mjs prepare --output dist/ffmpeg-component-publish
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component asset packaging failed" }

      - name: Attest signed FFmpeg component
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/ffmpeg-component-publish/*

      - name: Publish signed FFmpeg component
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:FFMPEG_COMPONENT_TAG" -f sha="$env:RELEASE_COMMIT"
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            $encodedTag = [Uri]::EscapeDataString($env:FFMPEG_COMPONENT_TAG)
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            try {
              $winner = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
            } catch {
              throw "FFmpeg component tag conflict has no complete Release. Manual recovery required."
            }
            $requiredAssets = @('ffmpeg.zip','manifest.json','gift-clip-test-tools.zip','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','SHA256SUMS.txt')
            $assetNames = @($winner.assets | ForEach-Object { [string]$_.name })
            if ($winner.tag_name -cne $env:FFMPEG_COMPONENT_TAG -or $winner.draft -or $winner.prerelease -or -not $winner.published_at -or $assetNames.Count -ne $requiredAssets.Count) {
              throw "Conflicting FFmpeg component Release is incomplete. Manual recovery required."
            }
            foreach ($name in $requiredAssets) {
              if (@($assetNames | Where-Object { $_ -ceq $name }).Count -ne 1) { throw "Conflicting FFmpeg component asset closure is invalid. Manual recovery required." }
            }
            Write-Host 'Another publisher created the FFmpeg component; the winner will be redownloaded and fully verified.'
            exit 0
          }
          gh release create $env:FFMPEG_COMPONENT_TAG --draft --verify-tag --title $env:FFMPEG_COMPONENT_TAG --latest=false
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component draft creation failed. Manual recovery required." }
          gh release upload $env:FFMPEG_COMPONENT_TAG dist/ffmpeg-component-publish/ffmpeg.zip dist/ffmpeg-component-publish/manifest.json dist/ffmpeg-component-publish/gift-clip-test-tools.zip dist/ffmpeg-component-publish/ffmpeg-9.0.tar.xz dist/ffmpeg-component-publish/ffmpeg-9.0.tar.xz.asc dist/ffmpeg-component-publish/ffmpeg-build-config.txt dist/ffmpeg-component-publish/ffmpeg-component-gate.txt dist/ffmpeg-component-publish/toolchain-lock.json dist/ffmpeg-component-publish/NOTICE.md dist/ffmpeg-component-publish/COPYING.LGPLv2.1 dist/ffmpeg-component-publish/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component upload failed; draft retained for manual recovery" }
          gh release edit $env:FFMPEG_COMPONENT_TAG --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component publication failed. Manual recovery required." }

      - name: Download published FFmpeg component
        if: env.RELEASE_EXISTS != 'true' && env.FFMPEG_COMPONENT_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/ffmpeg-component-published | Out-Null
          gh release download $env:FFMPEG_COMPONENT_TAG --dir dist/ffmpeg-component-published --pattern ffmpeg.zip --pattern manifest.json --pattern gift-clip-test-tools.zip --pattern ffmpeg-9.0.tar.xz --pattern ffmpeg-9.0.tar.xz.asc --pattern ffmpeg-build-config.txt --pattern ffmpeg-component-gate.txt --pattern toolchain-lock.json --pattern NOTICE.md --pattern COPYING.LGPLv2.1 --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "Published FFmpeg component redownload failed" }
          $encodedTag = [Uri]::EscapeDataString($env:FFMPEG_COMPONENT_TAG)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            throw "Published FFmpeg component metadata refetch failed. Manual recovery required."
          }
          $release | ConvertTo-Json -Depth 10 | Set-Content -NoNewline -Encoding utf8 dist/ffmpeg-component-release.json

      - name: Verify and install signed FFmpeg component
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $componentDirectory = if ($env:FFMPEG_COMPONENT_EXISTS -eq 'true') { 'dist/ffmpeg-component-download' } else { 'dist/ffmpeg-component-published' }
          node scripts/ffmpeg-component-assets.mjs verify-metadata --metadata dist/ffmpeg-component-release.json --input $componentDirectory --tag $env:FFMPEG_COMPONENT_TAG
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg component GitHub metadata or digest verification failed" }
          foreach ($asset in Get-ChildItem -LiteralPath $componentDirectory -File) {
            gh attestation verify $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg component attestation verification failed for $($asset.Name)" }
          }
          node scripts/ffmpeg-component-assets.mjs install --input $componentDirectory
          if ($LASTEXITCODE -ne 0) { throw "Signed FFmpeg component verification or installation failed" }
          New-Item -ItemType Directory -Force -Path dist/ffmpeg-source | Out-Null
          Copy-Item -LiteralPath "$componentDirectory/ffmpeg-9.0.tar.xz" -Destination dist/ffmpeg-source/ffmpeg-9.0.tar.xz
          Copy-Item -LiteralPath "$componentDirectory/ffmpeg-9.0.tar.xz.asc" -Destination dist/ffmpeg-source/ffmpeg-9.0.tar.xz.asc
          Copy-Item -LiteralPath "$componentDirectory/ffmpeg-build-config.txt" -Destination dist/ffmpeg-build-config.txt
          Copy-Item -LiteralPath "$componentDirectory/ffmpeg-component-gate.txt" -Destination dist/ffmpeg-component-gate.txt
          if (Test-Path dist/gift-clip-test-tools) { Remove-Item -LiteralPath dist/gift-clip-test-tools -Recurse -Force }
          Expand-Archive -LiteralPath "$componentDirectory/gift-clip-test-tools.zip" -DestinationPath dist/gift-clip-test-tools
          node scripts/gift-clip-test-tools.mjs | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cached gift clip test tools failed verification" }

      - name: Prepare standalone FFmpeg release asset
        if: env.RELEASE_EXISTS != 'true' && env.RELEASE_STANDALONE_FFMPEG == 'true'
        shell: pwsh
        run: |
          $componentDirectory = if ($env:FFMPEG_COMPONENT_EXISTS -eq 'true') { 'dist/ffmpeg-component-download' } else { 'dist/ffmpeg-component-published' }
          $standaloneDirectory = 'dist/standalone-ffmpeg'
          New-Item -ItemType Directory -Force -Path $standaloneDirectory | Out-Null
          Expand-Archive -LiteralPath "$componentDirectory/ffmpeg.zip" -DestinationPath $standaloneDirectory
          $source = Join-Path $standaloneDirectory 'ffmpeg.exe'
          $destination = 'dist/ffmpeg-windows-x64.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw 'Signed FFmpeg component does not contain ffmpeg.exe' }
          Copy-Item -LiteralPath $source -Destination $destination

          $componentManifest = Get-Content -LiteralPath "$componentDirectory/manifest.json" -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $destination).Length
          if ($componentManifest.authenticode -ne $true -or $componentManifest.sha256 -cne $hash -or [int64]$componentManifest.size -ne $size) {
            throw 'Standalone FFmpeg does not match the verified component manifest.'
          }
          go -C goserver run ./cmd/artifact-inspector authenticode --file ../dist/ffmpeg-windows-x64.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Standalone FFmpeg structured Authenticode inspection failed.' }
          "$hash  ffmpeg-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/ffmpeg-windows-x64.exe.sha256

      - name: Build release executable
        if: env.RELEASE_EXISTS != 'true'
        run: npm run build:exe
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          APP_COMMIT: ${{ env.RELEASE_COMMIT }}
          APP_UPDATE_API_URL: ${{ vars.UPDATE_API_BASE_URL }}

      - name: Run backend tests
        if: env.RELEASE_EXISTS != 'true'
        working-directory: goserver
        run: go test ./...

      - name: Prepare and sign release executable
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          EVSIGN_CERTIFICATE: ${{ vars.EVSIGN_CERTIFICATE }}
          EVSIGN_PUBLISHER_IDENTITY: ${{ vars.EVSIGN_PUBLISHER_IDENTITY }}
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_PASSWORD }}
        run: |
          Copy-Item -LiteralPath dist/gift-panel.exe -Destination dist/gift-panel-windows-x64.unsigned.exe
          node scripts/sign-evsign.mjs --profile stable dist/gift-panel-windows-x64.unsigned.exe dist/gift-panel-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Stable outer signing failed.' }
          go -C goserver run ./cmd/artifact-inspector authenticode --file ../dist/gift-panel-windows-x64.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Stable outer structured Authenticode inspection failed.' }
          Write-Host 'Verified outer application Authenticode signature.'

      - name: Verify deterministic gift clip exports from signed package chain
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GIFT_CLIP_FFMPEG_E2E: '1'
        run: |
          $tools = node scripts/gift-clip-test-tools.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Gift clip test-tool verification failed with exit code $LASTEXITCODE"
          }
          $env:FFMPEG_FULL_BIN = [IO.Path]::GetFullPath([string]$tools.ffmpeg)
          $env:FFPROBE_BIN = [IO.Path]::GetFullPath([string]$tools.ffprobe)
          npm run verify:gift-clip-export
          if ($LASTEXITCODE -ne 0) {
            throw "Gift clip browser E2E failed with exit code $LASTEXITCODE"
          }

      - name: Prepare release assets
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath dist/gift-panel-windows-x64.exe).Length
          "$hash  gift-panel-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/gift-panel-windows-x64.exe.sha256
          @{
            tag_name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            assets = @(
              @{
                name = "gift-panel-windows-x64.exe"
                browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/gift-panel-windows-x64.exe"
                size = $size
                digest = "sha256:$hash"
              }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-update.json
          $currentChangelog = Get-Content gift-panel-changelog.json -Raw | ConvertFrom-Json
          $releaseHistory = @()
          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -and $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          if ($previousTag) {
            try {
              $previousChangelog = Invoke-RestMethod -Uri "https://github.com/brainfk123/bilibili-live-gift-panel/releases/download/$previousTag/gift-panel-changelog.json" -TimeoutSec 20
              $releaseHistory = @($previousChangelog.releases)
            } catch {
              Write-Host "No hosted changelog exists for $previousTag; reading its bundled changelog from Git history."
              $previousChangelogJson = git show "${previousTag}:gift-panel-changelog.json" 2>$null
              $gitShowExitCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($gitShowExitCode -eq 0 -and $previousChangelogJson) {
                $previousChangelog = $previousChangelogJson | ConvertFrom-Json
                $releaseHistory = @($previousChangelog.releases)
              } else {
                Write-Host "No previous changelog is available; publishing the bundled current release only."
              }
            }
          }
          $historySeed = @()
          if (Test-Path .github/changelog-history.json) {
            $historySeedDocument = Get-Content .github/changelog-history.json -Raw | ConvertFrom-Json
            $historySeed = @($historySeedDocument.releases)
          } else {
            try {
              $historySeedDocument = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/brainfk123/bilibili-live-gift-panel/master/.github/changelog-history.json" -TimeoutSec 20
              $historySeed = @($historySeedDocument.releases)
            } catch {
              Write-Host "No changelog history seed is available."
            }
          }
          $seenVersions = @{}
          $mergedReleases = @()
          foreach ($release in @($currentChangelog.releases) + $releaseHistory + $historySeed) {
            $version = [string]$release.version
            if ($version -and -not $seenVersions.ContainsKey($version)) {
              $seenVersions[$version] = $true
              $mergedReleases += $release
            }
          }
          @{
            schemaVersion = 1
            releases = $mergedReleases
          } | ConvertTo-Json -Depth 8 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-changelog.json

      - name: Attest executable provenance
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/gift-panel-windows-x64.exe

      - name: Create GitHub release
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release draft creation failed" }
          gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/gift-panel-changelog.json dist/ffmpeg-source/ffmpeg-9.0.tar.xz dist/ffmpeg-source/ffmpeg-9.0.tar.xz.asc dist/ffmpeg-build-config.txt dist/ffmpeg-component-gate.txt third_party/ffmpeg/toolchain-lock.json third_party/ffmpeg/NOTICE.md third_party/ffmpeg/COPYING.LGPLv2.1
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed; draft retained for manual recovery" }
          if ($env:RELEASE_STANDALONE_FFMPEG -eq 'true') {
            gh release upload $env:RELEASE_TAG dist/ffmpeg-windows-x64.exe dist/ffmpeg-windows-x64.exe.sha256
            if ($LASTEXITCODE -ne 0) { throw "Standalone FFmpeg asset upload failed; draft retained for manual recovery" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed; manual recovery required" }

          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          } catch {
            throw "Published GitHub Release metadata could not be read; manual recovery required"
          }
          if ($release.draft -or $release.prerelease -or -not $release.published_at) {
            throw "Published GitHub Release metadata is incomplete; manual recovery required"
          }

          try {
            $publishedAt = [DateTimeOffset]$release.published_at
          } catch {
            throw "Published GitHub Release publication timestamp is invalid; manual recovery required"
          }

      - name: Redownload published standalone FFmpeg
        if: env.RELEASE_EXISTS != 'true' && env.RELEASE_STANDALONE_FFMPEG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item -LiteralPath dist/ffmpeg-windows-x64.exe,dist/ffmpeg-windows-x64.exe.sha256 -Force
          gh release download $env:RELEASE_TAG --dir dist --pattern ffmpeg-windows-x64.exe --pattern ffmpeg-windows-x64.exe.sha256
          if ($LASTEXITCODE -ne 0) { throw "Published standalone FFmpeg assets could not be redownloaded. Manual recovery required." }

      - name: Validate published release assets
        shell: pwsh
        run: |
          $requiredPaths = @('dist/gift-panel-windows-x64.exe', 'dist/gift-panel-windows-x64.exe.sha256', 'dist/gift-panel-update.json', 'dist/gift-panel-changelog.json')
          if ($env:RELEASE_STANDALONE_FFMPEG -eq 'true') {
            $requiredPaths += @('dist/ffmpeg-windows-x64.exe', 'dist/ffmpeg-windows-x64.exe.sha256')
          }
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Published GitHub Release is missing required assets. Manual recovery required."
            }
          }
          if ($env:RELEASE_STANDALONE_FFMPEG -eq 'true') {
            go -C goserver run ./cmd/artifact-inspector authenticode --file ../dist/ffmpeg-windows-x64.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
            if ($LASTEXITCODE -ne 0) { throw 'Published standalone FFmpeg structured Authenticode inspection failed. Manual recovery required.' }
            $ffmpegChecksum = Get-Content -LiteralPath dist/ffmpeg-windows-x64.exe.sha256 -Raw
            if ($ffmpegChecksum -cmatch '^(?<digest>[0-9a-fA-F]{64})\s+ffmpeg-windows-x64\.exe\s*$') {
              $expectedFFmpegHash = $Matches.digest
            } else {
              throw "Published standalone FFmpeg checksum is malformed. Manual recovery required."
            }
            $actualFFmpegHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/ffmpeg-windows-x64.exe).Hash
            if (-not [String]::Equals($actualFFmpegHash, $expectedFFmpegHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Published standalone FFmpeg does not match its checksum. Manual recovery required."
            }
            $componentManifestPath = if ($env:RELEASE_EXISTS -eq 'true') { 'dist/standalone-component-manifest.json' } else { 'goserver/ffmpeg/manifest.json' }
            $componentManifest = Get-Content -LiteralPath $componentManifestPath -Raw | ConvertFrom-Json
            $ffmpegSize = (Get-Item -LiteralPath dist/ffmpeg-windows-x64.exe).Length
            if ($componentManifest.version -cne '9.0' -or $componentManifest.authenticode -ne $true -or $componentManifest.sha256 -cne $actualFFmpegHash.ToLowerInvariant() -or [int64]$componentManifest.size -ne $ffmpegSize) {
              throw "Published standalone FFmpeg does not match the verified signed component manifest. Manual recovery required."
            }
          }
          go -C goserver run ./cmd/artifact-inspector authenticode --file ../dist/gift-panel-windows-x64.exe --country CN --organization 'NaisNet Technology Co., Ltd.' --organization-id 91210103MA7CJ3C094
          if ($LASTEXITCODE -ne 0) { throw 'Published EXE structured Authenticode inspection failed. Manual recovery required.' }
          $checksumText = Get-Content -LiteralPath dist/gift-panel-windows-x64.exe.sha256 -Raw
          if ($checksumText -cmatch '^(?<digest>[0-9a-fA-F]{64})\s+gift-panel-windows-x64\.exe\s*$') {
            $expectedHash = $Matches.digest
          } else {
            throw "Published checksum asset is malformed. Manual recovery required."
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash
          if (-not [String]::Equals($actualHash, $expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Published EXE does not match its checksum. Manual recovery required."
          }
          $actualSize = (Get-Item -LiteralPath dist/gift-panel-windows-x64.exe).Length
          $expectedDigest = "sha256:$($actualHash.ToLowerInvariant())"
          $expectedURL = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/gift-panel-windows-x64.exe"

          function Test-ExactJsonObjectProperties {
            param(
              [System.Text.Json.JsonElement]$Element,
              [string[]]$Names
            )
            if ($Element.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) {
              return $false
            }
            $actualNames = @($Element.EnumerateObject() | ForEach-Object { $_.Name })
            if ($actualNames.Count -ne $Names.Count) {
              return $false
            }
            foreach ($name in $Names) {
              if (@($actualNames | Where-Object { $_ -ceq $name }).Count -ne 1) {
                return $false
              }
            }
            return $true
          }

          $manifestDocument = $null
          try {
            $manifestJSON = Get-Content -LiteralPath dist/gift-panel-update.json -Raw
            $manifestDocument = [System.Text.Json.JsonDocument]::Parse($manifestJSON)
          } catch {
            throw "Published fallback update manifest is malformed. Manual recovery required."
          }
          try {
            $updateManifest = $manifestDocument.RootElement
            if (-not (Test-ExactJsonObjectProperties $updateManifest @('tag_name', 'draft', 'prerelease', 'assets'))) {
              throw "Published fallback update manifest metadata is inconsistent. Manual recovery required."
            }

            $tagName = $updateManifest.GetProperty('tag_name')
            $draft = $updateManifest.GetProperty('draft')
            $prerelease = $updateManifest.GetProperty('prerelease')
            $assets = $updateManifest.GetProperty('assets')
            if (
              $tagName.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or
              $tagName.GetString() -cne $env:RELEASE_TAG -or
              $draft.ValueKind -ne [System.Text.Json.JsonValueKind]::False -or
              $prerelease.ValueKind -ne [System.Text.Json.JsonValueKind]::False -or
              $assets.ValueKind -ne [System.Text.Json.JsonValueKind]::Array -or
              $assets.GetArrayLength() -ne 1
            ) {
              throw "Published fallback update manifest metadata is inconsistent. Manual recovery required."
            }

            $manifestAsset = $assets[0]
            if (-not (Test-ExactJsonObjectProperties $manifestAsset @('name', 'browser_download_url', 'size', 'digest'))) {
              throw "Published fallback update manifest asset is inconsistent. Manual recovery required."
            }
            $assetName = $manifestAsset.GetProperty('name')
            $assetURL = $manifestAsset.GetProperty('browser_download_url')
            $assetSize = $manifestAsset.GetProperty('size')
            $assetDigest = $manifestAsset.GetProperty('digest')
            [int64]$manifestSize = 0
            if (
              $assetName.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or
              $assetName.GetString() -cne 'gift-panel-windows-x64.exe' -or
              $assetURL.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or
              $assetURL.GetString() -cne $expectedURL -or
              $assetDigest.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or
              $assetDigest.GetString() -cne $expectedDigest -or
              $assetSize.ValueKind -ne [System.Text.Json.JsonValueKind]::Number -or
              -not $assetSize.TryGetInt64([ref]$manifestSize) -or
              $manifestSize -le 0 -or
              $manifestSize -ne $actualSize
            ) {
              throw "Published fallback update manifest asset is inconsistent. Manual recovery required."
            }
          } finally {
            $manifestDocument.Dispose()
          }
          try {
            $changelog = Get-Content -LiteralPath dist/gift-panel-changelog.json -Raw | ConvertFrom-Json
          } catch {
            throw "Published changelog is malformed. Manual recovery required."
          }
          if ($changelog.schemaVersion -ne 1 -or @($changelog.releases).Count -eq 0) {
            throw "Published changelog is incomplete. Manual recovery required."
          }
