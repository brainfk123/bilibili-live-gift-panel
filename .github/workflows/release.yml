name: Release Windows executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=dot

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:ui

      - name: Prepare backend UI assets
        run: npm run prepare:go-assets

      - name: Set up MSYS2 host environment
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          cache: false

      - name: Build and verify pinned FFmpeg
        shell: pwsh
        run: |
          $msys2Root = '${{ steps.msys2.outputs.msys2-location }}'
          $env:PATH = "$env:SystemRoot\System32;$msys2Root\usr\bin;$env:PATH"
          npm run build:ffmpeg -- -Msys2Root $msys2Root -InstallPinnedToolchain -BuildGiftClipTestTools
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned FFmpeg build failed with exit code $LASTEXITCODE"
          }
          npm run verify:ffmpeg
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg verification failed with exit code $LASTEXITCODE"
          }

      - name: Sign and verify inner FFmpeg
        shell: pwsh
        env:
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_PASSWORD }}
          EVSIGN_CERT: ${{ vars.EVSIGN_CERT }}
        run: |
          node scripts/sign-evsign.mjs dist/ffmpeg/ffmpeg.exe
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg signing failed with exit code $LASTEXITCODE"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath dist/ffmpeg/ffmpeg.exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Inner FFmpeg Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }
          Write-Host 'Verified inner FFmpeg Authenticode signature.'

      - name: Package and verify signed FFmpeg payload
        shell: pwsh
        env:
          FFMPEG_AUTHENTICODE: 'true'
          APP_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          node scripts/package-ffmpeg.mjs --input dist/ffmpeg/ffmpeg.exe
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg packaging failed with exit code $LASTEXITCODE"
          }
          npm run verify:ffmpeg
          if ($LASTEXITCODE -ne 0) {
            throw "Signed FFmpeg payload verification failed with exit code $LASTEXITCODE"
          }

      - name: Build release executable
        run: npm run build:exe
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          APP_COMMIT: ${{ github.sha }}

      - name: Run backend tests
        working-directory: goserver
        run: go test ./...

      - name: Prepare and sign release executable
        shell: pwsh
        env:
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          EVSIGN_PASSWORD: ${{ secrets.EVSIGN_PASSWORD }}
          EVSIGN_CERT: ${{ vars.EVSIGN_CERT }}
        run: |
          Copy-Item -LiteralPath dist/gift-panel.exe -Destination dist/gift-panel-windows-x64.exe
          node scripts/sign-evsign.mjs dist/gift-panel-windows-x64.exe

          $signature = Get-AuthenticodeSignature -LiteralPath dist/gift-panel-windows-x64.exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode verification failed: $($signature.Status) - $($signature.StatusMessage)"
          }
          Write-Host 'Verified outer application Authenticode signature.'

      - name: Install pinned Playwright Chromium for release E2E
        run: npm exec -- playwright install chromium

      - name: Verify deterministic gift clip exports from signed package chain
        shell: pwsh
        env:
          GIFT_CLIP_FFMPEG_E2E: '1'
        run: |
          $tools = node scripts/gift-clip-test-tools.mjs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Gift clip test-tool verification failed with exit code $LASTEXITCODE"
          }
          $env:FFMPEG_FULL_BIN = [IO.Path]::GetFullPath([string]$tools.ffmpeg)
          $env:FFPROBE_BIN = [IO.Path]::GetFullPath([string]$tools.ffprobe)
          npm run verify:gift-clip-export
          if ($LASTEXITCODE -ne 0) {
            throw "Gift clip browser E2E failed with exit code $LASTEXITCODE"
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath dist/gift-panel-windows-x64.exe).Length
          "$hash  gift-panel-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/gift-panel-windows-x64.exe.sha256
          @{
            tag_name = $env:RELEASE_TAG
            draft = $false
            prerelease = $false
            assets = @(
              @{
                name = "gift-panel-windows-x64.exe"
                browser_download_url = "https://github.com/brainfk123/bilibili-live-gift-panel/releases/download/$env:RELEASE_TAG/gift-panel-windows-x64.exe"
                size = $size
                digest = "sha256:$hash"
              }
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-update.json
          $currentChangelog = Get-Content gift-panel-changelog.json -Raw | ConvertFrom-Json
          $releaseHistory = @()
          $previousTag = git tag --sort=-version:refname | Where-Object { $_ -and $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          if ($previousTag) {
            try {
              $previousChangelog = Invoke-RestMethod -Uri "https://github.com/brainfk123/bilibili-live-gift-panel/releases/download/$previousTag/gift-panel-changelog.json" -TimeoutSec 20
              $releaseHistory = @($previousChangelog.releases)
            } catch {
              Write-Host "No hosted changelog exists for $previousTag; reading its bundled changelog from Git history."
              $previousChangelogJson = git show "${previousTag}:gift-panel-changelog.json" 2>$null
              $gitShowExitCode = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($gitShowExitCode -eq 0 -and $previousChangelogJson) {
                $previousChangelog = $previousChangelogJson | ConvertFrom-Json
                $releaseHistory = @($previousChangelog.releases)
              } else {
                Write-Host "No previous changelog is available; publishing the bundled current release only."
              }
            }
          }
          $historySeed = @()
          if (Test-Path .github/changelog-history.json) {
            $historySeedDocument = Get-Content .github/changelog-history.json -Raw | ConvertFrom-Json
            $historySeed = @($historySeedDocument.releases)
          } else {
            try {
              $historySeedDocument = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/brainfk123/bilibili-live-gift-panel/master/.github/changelog-history.json" -TimeoutSec 20
              $historySeed = @($historySeedDocument.releases)
            } catch {
              Write-Host "No changelog history seed is available."
            }
          }
          $seenVersions = @{}
          $mergedReleases = @()
          foreach ($release in @($currentChangelog.releases) + $releaseHistory + $historySeed) {
            $version = [string]$release.version
            if ($version -and -not $seenVersions.ContainsKey($version)) {
              $seenVersions[$version] = $true
              $mergedReleases += $release
            }
          }
          @{
            schemaVersion = 1
            releases = $mergedReleases
          } | ConvertTo-Json -Depth 8 | Set-Content -NoNewline -Encoding utf8 dist/gift-panel-changelog.json

      - name: Attest executable provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/gift-panel-windows-x64.exe

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/gift-panel-changelog.json dist/ffmpeg-source/ffmpeg-9.0.tar.xz dist/ffmpeg-source/ffmpeg-9.0.tar.xz.asc dist/ffmpeg-build-config.txt dist/ffmpeg-component-gate.txt third_party/ffmpeg/toolchain-lock.json third_party/ffmpeg/NOTICE.md third_party/ffmpeg/COPYING.LGPLv2.1 --clobber
            gh release edit $env:RELEASE_TAG --draft=false --latest
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 dist/gift-panel-update.json dist/gift-panel-changelog.json dist/ffmpeg-source/ffmpeg-9.0.tar.xz dist/ffmpeg-source/ffmpeg-9.0.tar.xz.asc dist/ffmpeg-build-config.txt dist/ffmpeg-component-gate.txt third_party/ffmpeg/toolchain-lock.json third_party/ffmpeg/NOTICE.md third_party/ffmpeg/COPYING.LGPLv2.1
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
