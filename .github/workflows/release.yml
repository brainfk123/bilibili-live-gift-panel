          $root=$rootItem.FullName;$allowedDirectories=@('sealed','tools');$seenDirectories=@{};$files=@();$queue=[Collections.Generic.Queue[IO.DirectoryInfo]]::new();$queue.Enqueue($rootItem)
          while($queue.Count -gt 0){
            $directory=$queue.Dequeue();$children=@(Get-ChildItem -LiteralPath $directory.FullName -Force)
            if($directory.FullName -cne $root -and $children.Count -eq 0){throw 'empty candidate directory'}
            foreach($child in $children){
              if($child.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'candidate extraction contains ReparsePoint'}
              $relative=$child.FullName.Substring($root.Length+1).Replace('\','/')
              if($child.PSIsContainer){if($relative -notin $allowedDirectories){throw 'unexpected candidate directory'};$seenDirectories[$relative]=$true;$queue.Enqueue($child)}
              elseif($child -is [IO.FileInfo]){$files+=$relative}else{throw 'unexpected candidate entry type'}
            }
          }
          foreach($directory in $allowedDirectories){if(-not $seenDirectories.ContainsKey($directory)){throw 'missing candidate directory'}}
          $allowedFiles=@("sealed/$env:STABLE_CANDIDATE_SHA256.exe",'stable-artifact-inspection.json','candidate-evidence.json','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','gift-panel-changelog.json','ffmpeg.zip','manifest.json','ffmpeg-windows-x64.exe','ffmpeg-windows-x64.exe.sha256','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','tools/artifact-inspector.exe','tools/artifact-inspector.exe.sha256','tools/verify-enrollment-build.mjs','tools/verify-enrollment-build.mjs.sha256')|Sort-Object
          if(Compare-Object $allowedFiles @($files|Sort-Object)){throw 'unexpected candidate file'}
      - name: Revalidate reviewed stable candidate
        shell: pwsh
        env:
          STABLE_CANDIDATE_INSPECTOR_SHA256: ${{ vars.STABLE_CANDIDATE_INSPECTOR_SHA256 }}
          STABLE_CANDIDATE_VERIFIER_SHA256: ${{ vars.STABLE_CANDIDATE_VERIFIER_SHA256 }}
          STABLE_TRUST_ROOT_SPKI_B64: ${{ vars.STABLE_TRUST_ROOT_SPKI_B64 }}
          STABLE_TRUST_ROOT_SPKI_SHA256: ${{ vars.STABLE_TRUST_ROOT_SPKI_SHA256 }}
          STABLE_BOOTSTRAP_POLICY_B64: ${{ vars.STABLE_BOOTSTRAP_POLICY_B64 }}
          STABLE_BOOTSTRAP_POLICY_SHA256: ${{ vars.STABLE_BOOTSTRAP_POLICY_SHA256 }}
          STABLE_BOOTSTRAP_POLICY_EPOCH: ${{ vars.STABLE_BOOTSTRAP_POLICY_EPOCH }}
          STABLE_AUTHORIZATION_POLICY_B64: ${{ vars.STABLE_AUTHORIZATION_POLICY_B64 }}
          STABLE_AUTHORIZATION_POLICY_SHA256: ${{ vars.STABLE_AUTHORIZATION_POLICY_SHA256 }}
          STABLE_AUTHORIZATION_POLICY_EPOCH: ${{ vars.STABLE_AUTHORIZATION_POLICY_EPOCH }}
          STABLE_FFMPEG_COMPONENT_MANIFEST_SHA256: ${{ vars.STABLE_FFMPEG_COMPONENT_MANIFEST_SHA256 }}
        run: |
          $inspector='candidate/tools/artifact-inspector.exe'; $verifier='candidate/tools/verify-enrollment-build.mjs'
          if ((Get-FileHash $inspector -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_CANDIDATE_INSPECTOR_SHA256 -or (Get-FileHash $verifier -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_CANDIDATE_VERIFIER_SHA256 -or (Get-Content candidate/tools/artifact-inspector.exe.sha256 -Raw) -cne "$env:STABLE_CANDIDATE_INSPECTOR_SHA256  artifact-inspector.exe" -or (Get-Content candidate/tools/verify-enrollment-build.mjs.sha256 -Raw) -cne "$env:STABLE_CANDIDATE_VERIFIER_SHA256  verify-enrollment-build.mjs") { throw 'Reviewed candidate verifier tooling hash mismatch.' }
          $candidate='candidate/sealed/'+$env:STABLE_CANDIDATE_SHA256+'.exe'
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_CANDIDATE_SHA256 -or (Get-Item $candidate).Length -ne [int64]$env:STABLE_CANDIDATE_SIZE) { throw 'Reviewed candidate bytes mismatch.' }
          $candidateEvidence=Get-Content candidate/candidate-evidence.json -Raw | ConvertFrom-Json
          $candidateChangelogHash=(Get-FileHash candidate/gift-panel-changelog.json -Algorithm SHA256).Hash.ToLowerInvariant();$changelogKeys=@($candidateEvidence.changelog.PSObject.Properties.Name|Sort-Object)
          if ($candidateEvidence.tag -cne $env:RELEASE_TAG -or $candidateEvidence.commit -cne $env:STABLE_CANDIDATE_COMMIT_SHA -or $candidateEvidence.signedFileSha256 -cne $env:STABLE_CANDIDATE_SHA256 -or $candidateEvidence.rootKeyId -cne "sha256:$env:STABLE_TRUST_ROOT_SPKI_SHA256" -or (Compare-Object @('historySha256','sha256','toolingCommit') $changelogKeys) -or $candidateEvidence.changelog.sha256 -cne $candidateChangelogHash -or $candidateEvidence.changelog.historySha256 -cne $env:STABLE_CHANGELOG_HISTORY_SHA256 -or $candidateEvidence.changelog.toolingCommit -cne $env:RELEASE_TOOLING_COMMIT_SHA) { throw 'Candidate evidence mismatch.' }
          $candidateRoot=(Resolve-Path candidate).Path
          $allowed=@("sealed/$env:STABLE_CANDIDATE_SHA256.exe",'stable-artifact-inspection.json','candidate-evidence.json','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','gift-panel-changelog.json','ffmpeg.zip','manifest.json','ffmpeg-windows-x64.exe','ffmpeg-windows-x64.exe.sha256','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','tools/artifact-inspector.exe','tools/artifact-inspector.exe.sha256','tools/verify-enrollment-build.mjs','tools/verify-enrollment-build.mjs.sha256')|Sort-Object
          $actual=@(Get-ChildItem $candidateRoot -File -Recurse|ForEach-Object{$_.FullName.Substring($candidateRoot.Length+1).Replace('\','/')}|Sort-Object)
          if(Compare-Object $allowed $actual){throw 'Downloaded artifact contains an unexpected candidate file.'}
          try { $root=[Convert]::FromBase64String($env:STABLE_TRUST_ROOT_SPKI_B64); $bootstrap=[Convert]::FromBase64String($env:STABLE_BOOTSTRAP_POLICY_B64); $authorization=[Convert]::FromBase64String($env:STABLE_AUTHORIZATION_POLICY_B64) } catch { throw 'Publish trust Base64 is invalid.' }
          $trust="$env:RUNNER_TEMP/publish-trust"; New-Item -ItemType Directory -Path $trust -ErrorAction Stop | Out-Null
          [IO.File]::WriteAllBytes("$trust/root.der",$root); [IO.File]::WriteAllBytes("$trust/bootstrap.json",$bootstrap); [IO.File]::WriteAllBytes("$trust/authorization.json",$authorization)
          if ((Get-FileHash "$trust/root.der" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_TRUST_ROOT_SPKI_SHA256 -or (Get-FileHash "$trust/bootstrap.json" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_BOOTSTRAP_POLICY_SHA256 -or (Get-FileHash "$trust/authorization.json" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_AUTHORIZATION_POLICY_SHA256) { throw 'Publish trust digest mismatch.' }
          node $verifier --inspector $inspector --artifact $candidate --artifact-inspection candidate/stable-artifact-inspection.json --artifact-sidecar candidate/gift-panel-windows-x64.exe.sha256 --standalone-ffmpeg candidate/ffmpeg-windows-x64.exe --ffmpeg-sidecar candidate/ffmpeg-windows-x64.exe.sha256 --ffmpeg-archive candidate/ffmpeg.zip --ffmpeg-manifest candidate/manifest.json --ffmpeg-manifest-sha256 $env:STABLE_FFMPEG_COMPONENT_MANIFEST_SHA256 --root-spki "$trust/root.der" --root-sha256 $env:STABLE_TRUST_ROOT_SPKI_SHA256 --bootstrap-policy "$trust/bootstrap.json" --bootstrap-policy-sha256 $env:STABLE_BOOTSTRAP_POLICY_SHA256 --bootstrap-policy-epoch $env:STABLE_BOOTSTRAP_POLICY_EPOCH --authorization-policy "$trust/authorization.json" --authorization-policy-sha256 $env:STABLE_AUTHORIZATION_POLICY_SHA256 --authorization-policy-epoch $env:STABLE_AUTHORIZATION_POLICY_EPOCH --version $env:RELEASE_VERSION --tag $env:RELEASE_TAG --commit $env:STABLE_CANDIDATE_COMMIT_SHA --output candidate/stable-release-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Final candidate authorization verification failed.' }
          $releaseEvidence=Get-Content candidate/stable-release-evidence.json -Raw|ConvertFrom-Json
          if($null -ne $releaseEvidence.changelog){throw 'Final evidence changelog field already exists.'}
          $releaseEvidence|Add-Member -NotePropertyName changelog -NotePropertyValue ([pscustomobject][ordered]@{sha256=$candidateChangelogHash;historySha256=$env:STABLE_CHANGELOG_HISTORY_SHA256;toolingCommit=$env:RELEASE_TOOLING_COMMIT_SHA})
          $releaseEvidence|ConvertTo-Json -Depth 12|Set-Content -NoNewline -Encoding utf8 candidate/stable-release-evidence.json
          $releaseEvidence=Get-Content candidate/stable-release-evidence.json -Raw|ConvertFrom-Json
          if($releaseEvidence.changelog.sha256 -cne $candidateChangelogHash -or $releaseEvidence.changelog.historySha256 -cne $env:STABLE_CHANGELOG_HISTORY_SHA256 -or $releaseEvidence.changelog.toolingCommit -cne $env:RELEASE_TOOLING_COMMIT_SHA){throw 'Final evidence changelog binding failed.'}
          "PUBLISH_INSPECTOR=$inspector" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create expected-name stable asset
        shell: pwsh
        run: |
          & $env:PUBLISH_INSPECTOR link-sealed-executable --directory candidate/sealed --sha256 $env:STABLE_CANDIDATE_SHA256 --expected-name gift-panel-windows-x64.exe | Set-Content -NoNewline -Encoding utf8 candidate/expected-name-link.json
          if ($LASTEXITCODE -ne 0) { throw 'Expected-name stable hard link failed.' }
          $link=Get-Content candidate/expected-name-link.json -Raw | ConvertFrom-Json
          if ($link.name -cne 'gift-panel-windows-x64.exe' -or $link.sha256 -cne $env:STABLE_CANDIDATE_SHA256 -or (Get-FileHash candidate/sealed/gift-panel-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:STABLE_CANDIDATE_SHA256) { throw 'Expected-name stable hard link evidence mismatch.' }
      - name: Attest reviewed stable assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/sealed/gift-panel-windows-x64.exe
            candidate/ffmpeg-windows-x64.exe
            candidate/stable-release-evidence.json
      - name: Recheck reviewed tag before stable draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_REVIEWED_TAG_OBJECT_SHA: ${{ vars.STABLE_REVIEWED_TAG_OBJECT_SHA }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $encoded=[Uri]::EscapeDataString($env:RELEASE_TAG)
          $ref=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encoded" -Headers $headers
          if([string]$ref.object.sha -cne $env:STABLE_REVIEWED_TAG_OBJECT_SHA){throw 'Reviewed stable raw tag object changed.'}
          if([string]$ref.object.type -ceq 'tag'){
            $tagObject=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags/$env:STABLE_REVIEWED_TAG_OBJECT_SHA" -Headers $headers
            if([string]$tagObject.object.type -cne 'commit' -or [string]$tagObject.object.sha -cne $env:STABLE_CANDIDATE_COMMIT_SHA){throw 'Reviewed stable peeled tag commit changed.'}
          } elseif([string]$ref.object.type -cne 'commit' -or $env:STABLE_REVIEWED_TAG_OBJECT_SHA -cne $env:STABLE_CANDIDATE_COMMIT_SHA){throw 'Reviewed stable lightweight tag binding changed.'}

      - name: Create immutable-shaped stable draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG --draft --verify-tag --title $env:RELEASE_TAG --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Stable draft creation failed.' }
          gh release upload $env:RELEASE_TAG candidate/sealed/gift-panel-windows-x64.exe candidate/gift-panel-windows-x64.exe.sha256 candidate/gift-panel-update.json candidate/gift-panel-changelog.json candidate/stable-release-evidence.json candidate/ffmpeg-9.0.tar.xz candidate/ffmpeg-9.0.tar.xz.asc candidate/ffmpeg-build-config.txt candidate/ffmpeg-component-gate.txt candidate/toolchain-lock.json candidate/NOTICE.md candidate/COPYING.LGPLv2.1 candidate/ffmpeg-windows-x64.exe candidate/ffmpeg-windows-x64.exe.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Stable draft upload failed.' }
      - name: Read back exact stable draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $tag=[Uri]::EscapeDataString($env:RELEASE_TAG); $release=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
          $required=@('gift-panel-windows-x64.exe','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','gift-panel-changelog.json','stable-release-evidence.json','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','ffmpeg-windows-x64.exe','ffmpeg-windows-x64.exe.sha256')
          $names=@($release.assets|ForEach-Object{[string]$_.name}); if(-not $release.draft -or $names.Count -ne $required.Count){throw 'Stable draft closure mismatch.'}
          New-Item -ItemType Directory -Path draft-readback -ErrorAction Stop|Out-Null
          foreach($name in $required){if(@($names|Where-Object{$_ -ceq $name}).Count -ne 1){throw 'Stable draft name mismatch.'};gh release download $env:RELEASE_TAG --dir draft-readback --pattern $name;if($LASTEXITCODE -ne 0){throw 'Stable draft readback failed.'};$source=if($name -ceq 'gift-panel-windows-x64.exe'){'candidate/sealed/gift-panel-windows-x64.exe'}else{"candidate/$name"};$hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant();$asset=@($release.assets|Where-Object{$_.name -ceq $name})[0];if((Get-FileHash "draft-readback/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash -or [string]$asset.digest -cne "sha256:$hash"){throw 'Stable draft bytes or API asset name mismatch.'}}
      - name: Recheck reviewed tag before stable publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_REVIEWED_TAG_OBJECT_SHA: ${{ vars.STABLE_REVIEWED_TAG_OBJECT_SHA }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $encoded=[Uri]::EscapeDataString($env:RELEASE_TAG)
          $ref=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encoded" -Headers $headers
          if([string]$ref.object.sha -cne $env:STABLE_REVIEWED_TAG_OBJECT_SHA){throw 'Reviewed stable raw tag object changed.'}
          if([string]$ref.object.type -ceq 'tag'){
            $tagObject=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags/$env:STABLE_REVIEWED_TAG_OBJECT_SHA" -Headers $headers
            if([string]$tagObject.object.type -cne 'commit' -or [string]$tagObject.object.sha -cne $env:STABLE_CANDIDATE_COMMIT_SHA){throw 'Reviewed stable peeled tag commit changed.'}
          } elseif([string]$ref.object.type -cne 'commit' -or $env:STABLE_REVIEWED_TAG_OBJECT_SHA -cne $env:STABLE_CANDIDATE_COMMIT_SHA){throw 'Reviewed stable lightweight tag binding changed.'}

      - name: Publish stable as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Stable publication failed.' }
      - name: Verify final published stable closure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'};$tag=[Uri]::EscapeDataString($env:RELEASE_TAG)
          $release=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
          if($release.draft -or $release.prerelease -or -not $release.published_at){throw 'Published stable state is invalid.'}
          $required=@('gift-panel-windows-x64.exe','gift-panel-windows-x64.exe.sha256','gift-panel-update.json','gift-panel-changelog.json','stable-release-evidence.json','ffmpeg-9.0.tar.xz','ffmpeg-9.0.tar.xz.asc','ffmpeg-build-config.txt','ffmpeg-component-gate.txt','toolchain-lock.json','NOTICE.md','COPYING.LGPLv2.1','ffmpeg-windows-x64.exe','ffmpeg-windows-x64.exe.sha256')
          $names=@($release.assets|ForEach-Object{[string]$_.name})
          if($names.Count -ne $required.Count){throw 'The exact published asset closure changed after draft readback.'}
          New-Item -ItemType Directory -Path published-readback -ErrorAction Stop|Out-Null
          foreach($name in $required){
            if(@($names|Where-Object{$_ -ceq $name}).Count -ne 1){throw 'The exact published asset closure changed after draft readback.'}
            gh release download $env:RELEASE_TAG --dir published-readback --pattern $name
            if($LASTEXITCODE -ne 0){throw 'The exact published asset closure changed after draft readback.'}
            $source=if($name -ceq 'gift-panel-windows-x64.exe'){'candidate/sealed/gift-panel-windows-x64.exe'}else{"candidate/$name"}
            $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $source).Length;$asset=@($release.assets|Where-Object{$_.name -ceq $name})[0]
            if((Get-FileHash "published-readback/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash -or (Get-Item "published-readback/$name").Length -ne $size -or [string]$asset.digest -cne "sha256:$hash" -or [int64]$asset.size -ne $size){throw 'The exact published asset closure changed after draft readback.'}
          }
          $latest=Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
          if($latest.id -ne $release.id -or $latest.tag_name -cne $env:RELEASE_TAG -or $latest.draft -or $latest.prerelease -or -not $latest.published_at){throw 'Published stable is not exact latest.'}
          $latestNames=@($latest.assets|ForEach-Object{[string]$_.name})
          if($latestNames.Count -ne $required.Count){throw 'The latest asset closure changed after published readback.'}
          foreach($name in $required){
            if(@($latestNames|Where-Object{$_ -ceq $name}).Count -ne 1){throw 'The latest asset closure changed after published readback.'}
            $releaseAsset=@($release.assets|Where-Object{$_.name -ceq $name})[0];$latestAsset=@($latest.assets|Where-Object{$_.name -ceq $name})[0]
            if([string]$latestAsset.id -cne [string]$releaseAsset.id -or [string]$latestAsset.digest -cne [string]$releaseAsset.digest -or [int64]$latestAsset.size -ne [int64]$releaseAsset.size){throw 'The latest asset closure changed after published readback.'}
          }
