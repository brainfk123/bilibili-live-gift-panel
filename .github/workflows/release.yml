name: Release Windows executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish or repair
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: goserver/go.mod
          cache-dependency-path: goserver/go.sum

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=dot

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:ui

      - name: Build release executable
        run: npm run build:exe
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          APP_COMMIT: ${{ github.sha }}

      - name: Run backend tests
        working-directory: goserver
        run: go test ./...

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item -LiteralPath dist/gift-panel.exe -Destination dist/gift-panel-windows-x64.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/gift-panel-windows-x64.exe).Hash.ToLowerInvariant()
          "$hash  gift-panel-windows-x64.exe" | Set-Content -NoNewline -Encoding ascii dist/gift-panel-windows-x64.exe.sha256

      - name: Attest executable provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/gift-panel-windows-x64.exe

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256 --clobber
            gh release edit $env:RELEASE_TAG --draft=false --latest
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
            gh release upload $env:RELEASE_TAG dist/gift-panel-windows-x64.exe dist/gift-panel-windows-x64.exe.sha256
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }

      - name: Mirror release to GitCode
        id: gitcode-release
        if: ${{ secrets.GITCODE_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          ./scripts/publish-gitcode-release.ps1 `
            -Token $env:GITCODE_TOKEN `
            -Tag $env:RELEASE_TAG `
            -AssetPath dist/gift-panel-windows-x64.exe,dist/gift-panel-windows-x64.exe.sha256

      - name: Report GitCode mirror failure
        if: ${{ steps.gitcode-release.outcome == 'failure' }}
        shell: pwsh
        run: Write-Warning "GitHub Release succeeded, but the GitCode mirror failed. The application will fall back to GitHub until the mirror is repaired."
