name: Test Tencent COS connectivity

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cos-connectivity-test.yml'
      - 'scripts/test-cos-connectivity.mjs'

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
      TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
      COS_BUCKET: ${{ vars.COS_BUCKET }}
      COS_REGION: ${{ vars.COS_REGION }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate COS configuration
        shell: bash
        run: |
          missing=0
          for name in TENCENT_CLOUD_SECRET_ID TENCENT_CLOUD_SECRET_KEY COS_BUCKET COS_REGION; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing COS configuration::$name is not configured in repository Secrets or Variables."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install official Tencent COS SDK
        run: npm install --no-save --ignore-scripts cos-nodejs-sdk-v5@3.0.0

      - name: Upload and verify test object
        run: node scripts/test-cos-connectivity.mjs
